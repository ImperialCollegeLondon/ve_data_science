classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cdsapi>=0.7.6,<0.8",
  "cftime>=1.6.4.post1,<2",
  "ipython>=9.16.1,<10",
  "jedi>=0.19.2,<0.20",
  "jupyterlab>=4.6.3,<5",
  "jupyterlab-myst>=2.4.2,<3",
  "jupytext>=1.19.5,<2",
  "numpy>=2.5.2,<3",
  "pre-commit>=4.6.2,<5",
  "pymupdf4llm>=0.0.27,<0.1",
  "pyproj>=3.7.1,<4",
  "pyprojroot>=0.3.0",
  "pytest>=9.1.1",
  "pyyaml>=6.0.2,<7",
  "radian>=0.6.13,<0.8",
  "rasterio>=1.5.1,<2",
  "rioxarray>=0.23.0,<0.24",
  "requests>=2.32.5,<3",
  "ruff>=0.16.3,<0.18",
  "SALib>=1.5.1,<2",
  "scipy>=1.16,<2",
  "shapely>=2.1.1,<3",
  "tomli-w>=1.2.0,<2",
  "trafilatura>=2.0.0,<3",
  "tree-sitter-language-pack>=0.13,<1",
  "types-pyyaml>=6.0.12.20260724,<7",
  "virtual-ecosystem",
  "xarray[io]>=2026.7.0,<2027",
]
description = "This repository is the data science repository for the Virtual Ecosystem project. It is used to store all the research and analysis being used to parameterise and run the Virtual Ecosystem model."
license = "BSD-3-Clause"
name = "ve-data-science"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.urls]
Repository = "https://github.com/ImperialCollegeLondon/ve_data_science"

[dependency-groups]
# Each group overrides the PyPI release with a git build via
# [tool.uv.sources] below.
# the latest developmental version of VE from GitHub
dev = ["virtual-ecosystem"]
# the specific pinned version of VE by GitHub commit hash, which is rarely
# useful outside of testing and development; this will likely be removed once
# the release version on PyPI is always tested to be stable
dev-pinned = ["virtual-ecosystem"]
# a specific PR version of VE by GitHub commit hash, this is used to test
# if the PR version of VE is working with the newly prepared input data
dev-PR1889 = ["virtual-ecosystem"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "D", # pydocstyle
  "I", # isort
  "UP", # pyupgrade
  "RUF", # ruff-only checking
  "NPY201", # Numpy 2.0.1
]

# On top of the Google convention, disable:
ignore = [
  "D202", # Blank line after docstring is ok
  "D107", # Location of __init__ docstring in class not __init__"
]

[tool.jupytext]
# Stop jupytext from removing mystnb and other settings in MyST Notebook YAML headers
notebook_metadata_filter = "settings,mystnb,language_info,ve_data_science,-jupytext.text_representation.jupytext_version"
# Also stop it from stripping cell metadata, except for specific ones to lose.
cell_metadata_filter = "all,-trusted"

[tool.uv]
# Dependency management only; do not try to build/install this repo as a Python package.
package = false
# uv enables a group named `dev` by default; turn that off so the git
# groups stay opt-in and conflict-free.
default-groups = []
conflicts = [
  [
    { group = "dev" },
    { group = "dev-pinned" },
    { group = "dev-PR1889" },
  ],
]

[tool.uv.sources]
virtual-ecosystem = [
  { git = "https://github.com/ImperialCollegeLondon/virtual_ecosystem.git", group = "dev" },
  { git = "https://github.com/ImperialCollegeLondon/virtual_ecosystem.git", rev = "0f67349", group = "dev-pinned" },
  { git = "https://github.com/ImperialCollegeLondon/virtual_ecosystem.git", rev = "72f8724629ee8fbbddadac460a2c2abd6c483f68", group = "dev-PR1889" },
]

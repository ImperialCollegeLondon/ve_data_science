name: Python Tests

on:
  workflow_dispatch:
  push:
    branches: [main, constant-search-microbial-pilot]
    paths:
      - 'tools/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-tests.yml'
      - '.github/skills/ve-constant-search/**'
  pull_request:
    paths:
      - 'tools/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-tests.yml'
      - '.github/skills/ve-constant-search/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group dev-pinned

      - name: Lint tools/python
        run: |
          uv run --no-sync ruff check tools/python
          uv run --no-sync ruff format --check tools/python

      - name: Run pytest
        run:
          uv run --no-sync --with pytest python -m pytest -c
          tools/python/pyproject.toml tools/python/tests

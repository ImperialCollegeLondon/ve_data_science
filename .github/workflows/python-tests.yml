name: Python Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'tools/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint tools/python
        run: |
          uv run --no-sync ruff check tools/python
          uv run --no-sync ruff format --check tools/python

      - name: Run pytest
        run:
          uv run --no-sync --with pytest python -m pytest -c
          tools/python/pyproject.toml tools/python/tests

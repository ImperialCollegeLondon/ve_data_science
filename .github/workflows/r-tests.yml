name: R Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"
  pull_request:
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true # faster binary package installs

      # --- Python: uv ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      # --- System libraries required by R packages ---
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libicu-dev \
            libnetcdf-dev \
            libssl-dev \
            libudunits2-dev \
            make

      # --- R dependencies ---
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: any::sessioninfo
          extra-packages: |
            any::box
            any::cli
            any::here
            any::testthat
            any::withr
            any::reticulate
            any::toml
            any::tidync
            any::purrr
            any::RNetCDF
            any::dplyr
            any::stringr
            any::readr
            any::tibble
            any::lubridate
            any::tidyr
            any::rlang
            any::jsonlite
            any::R6
            any::qs2
            any::memoise
            any::shiny

      - name: Install pizzarr from r-universe
        run: |
          repo <- "https://zarr-developers.r-universe.dev"
          available_version <- available.packages(repos = repo)[
            "pizzarr", "Version"
          ]
          installed <- requireNamespace("pizzarr", quietly = TRUE)
          installed_repo <- if (installed) {
            packageDescription("pizzarr")$Repository
          } else {
            NA_character_
          }
          installed_version <- if (installed) {
            as.character(packageVersion("pizzarr"))
          } else {
            NA_character_
          }

          if (
            !identical(installed_repo, repo) ||
              !identical(installed_version, available_version)
          ) {
            install.packages(
              "pizzarr",
              repos = repo,
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }
        shell: Rscript {0}

      - name: Verify pizzarr backend
        run: |
          stopifnot(
            identical(
              packageDescription("pizzarr")$Repository,
              "https://zarr-developers.r-universe.dev"
            ),
            length(pizzarr::pizzarr_compiled_features()) > 0
          )
        shell: Rscript {0}

      # --- Tests ---
      - name: Run R tests
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          testthat::test_dir(
            here::here("tools/R/tests/testthat"),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

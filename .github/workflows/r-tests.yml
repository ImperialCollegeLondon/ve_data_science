name: R Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"
  pull_request:
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENV_PATHS_ROOT: ~/.cache/R/renv

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true # faster binary package installs

      # --- Python: uv ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      # --- System libraries required by R packages ---
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gdal-bin \
            libabsl-dev \
            libclang-dev \
            libcurl4-openssl-dev \
            libfftw3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdal-dev \
            libgeos-dev \
            libicu-dev \
            libnetcdf-dev \
            libnode-dev \
            libpng-dev \
            libproj-dev \
            libssl-dev \
            libudunits2-dev \
            libx11-dev \
            libzmq3-dev \
            make \
            pandoc

      # --- R dependencies (renv lockfile + GitHub Actions cache) ---
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore R dependencies with renv
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) {
            install.packages("renv")
          }
          renv::restore()
        shell: Rscript {0}

      # --- Tests ---
      - name: Run R tests
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          testthat::test_dir(
            here::here("tools/R/tests/testthat"),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

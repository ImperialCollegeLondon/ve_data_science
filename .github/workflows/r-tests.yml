name: R Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"
  pull_request:
    paths:
      - "tools/R/R/**"
      - "tools/R/tests/testthat/**"
      - ".github/workflows/r-tests.yml"

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true # faster binary package installs
          extra-repositories: |
            https://zarr-developers.r-universe.dev

      # --- Python: uv ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: uv sync

      # --- System libraries required by R packages ---
      - name: Install system dependencies
        run: sudo apt-get install -y libudunits2-dev libnetcdf-dev

      # --- R dependencies ---
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: any::sessioninfo
          extra-packages: |
            any::box
            any::cli
            any::here
            any::testthat
            any::withr
            any::reticulate
            any::toml
            any::tidync
            any::purrr
            any::RNetCDF
            any::dplyr
            any::stringr
            pizzarr=standard::pizzarr

      # --- Tests ---
      - name: Run R tests
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          testthat::test_dir(
            here::here("tools/R/tests/testthat"),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install locked Python dependencies with the pinned pilot VE
        run: uv sync --locked --group dev-pinned

      - name: Check out matching pinned Virtual Ecosystem source
        shell: bash
        run: |
          set -euo pipefail
          ve_commit="$(uv run --no-sync python -c '
          import tomllib
          from pathlib import Path
          sources = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["uv"]["sources"]["virtual-ecosystem"]
          print(next(source["rev"] for source in sources if source.get("group") == "dev-pinned"))
          ')"
          ve_root="$(dirname "$GITHUB_WORKSPACE")/virtual_ecosystem"
          if [[ -e "$ve_root" ]]; then
            echo "VE source checkout already exists: $ve_root" >&2
            exit 1
          fi
          git init -q "$ve_root"
          git -C "$ve_root" remote add origin \
            https://github.com/ImperialCollegeLondon/virtual_ecosystem.git
          git -C "$ve_root" fetch --quiet --depth 1 origin "$ve_commit"
          git -C "$ve_root" checkout --quiet --detach FETCH_HEAD
          if [[ "$(git -C "$ve_root" rev-parse HEAD)" != "$ve_commit" ]]; then
            echo "VE checkout does not match the pilot pin" >&2
            exit 1
          fi
          VE_ROOT="$ve_root" uv run --no-sync python -c '
          import hashlib
          import os
          from pathlib import Path

          import virtual_ecosystem

          def digests(root):
              return {
                  path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in root.rglob("*.py")
              }

          installed = Path(virtual_ecosystem.__file__).parent
          source = Path(os.environ["VE_ROOT"], "virtual_ecosystem")
          if digests(installed) != digests(source):
              raise ValueError("Installed VE does not match the pinned source")
          '
          echo "Prepared pinned VE source at $ve_commit"

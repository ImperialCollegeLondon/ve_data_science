rOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\nnan_to_num(x: _NestedSequence[_ArrayLike[ScalarT]], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> NDArray[ScalarT]\nnan_to_num(x: _SupportsArray[DTypeT], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.ndarray[_AnyShape, DTypeT] | Any\nnan_to_num(x: bool, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.bool\nnan_to_num(x: int, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.int_ | Any\nnan_to_num(x: float, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.float64 | Any\nnan_to_num(x: ScalarOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\nnan_to_num(x: _NestedSequence[_ArrayLike[ScalarT]], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> NDArray[ScalarT]\nnan_to_num(x: _SupportsArray[DTypeT], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.ndarray[_AnyShape, DTypeT] | Any\nnan_to_num(x: bool, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.bool\nnan_to_num(x: int, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.int_ | Any\nnan_to_num(x: ScalarOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\nnan_to_num(x: _NestedSequence[_ArrayLike[ScalarT]], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> NDArray[ScalarT]\nnan_to_num(x: _SupportsArray[DTypeT], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.ndarray[_AnyShape, DTypeT] | Any\nnan_to_num(x: bool, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.bool\nnan_to_num(x: ScalarOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\nnan_to_num(x: _NestedSequence[_ArrayLike[ScalarT]], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> NDArray[ScalarT]\nnan_to_num(x: _SupportsArray[DTypeT], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> np.ndarray[_AnyShape, DTypeT] | Any\nnan_to_num(x: ScalarOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\nnan_to_num(x: _NestedSequence[_ArrayLike[ScalarT]], copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> NDArray[ScalarT]\nnan_to_num(x: ScalarOrArrayT, copy: bool=True, nan: float=0.0, posinf: float | None=None, neginf: float | None=None) -> ScalarOrArrayT\n\nReplace NaN with zero and infinity with large finite numbers (default\nbehaviour) or with the numbers defined by the user using the `nan`,\n`posinf` and/or `neginf` keywords.\n\nIf `x` is inexact, NaN is replaced by zero or by the user defined value in\n`nan` keyword, infinity is replaced by the largest finite floating point\nvalues representable by ``x.dtype`` or by the user defined value in\n`posinf` keyword and -infinity is replaced by the most negative finite\nfloating point values representable by ``x.dtype`` or by the user defined\nvalue in `neginf` keyword.\n\nFor complex dtypes, the above is applied to each of the real and\nimaginary components of `x` separately.\n\nIf `x` is not inexact, then no replacements are made.\n\nParameters\n----------\nx : scalar or array_like\n    Input data.\ncopy : bool, optional\n    Whether to create a copy of `x` (True) or to replace values\n    in-place (False). The in-place operation only occurs if\n    casting to an array does not require a copy.\n    Default is True.\nnan : int, float, or bool or array_like of int, float, or bool, optional\n    Values to be used to fill NaN values. If no values are passed\n    then NaN values will be replaced with 0.0.\nposinf : int, float, or bool or array_like of int, float, or bool, optional\n    Values to be used to fill positive infinity values. If no values are\n    passed then positive infinity values will be replaced with a very\n    large number.\nneginf : int, float, or bool or array_like of int, float, or bool, optional\n    Values to be used to fill negative infinity values. If no values are\n    passed then negative infinity values will be replaced with a very\n    small (or negative) number.\n\nReturns\n-------\nout : ndarray\n    `x`, with the non-finite values replaced. If `copy` is False, this may\n    be `x` itself.\n\nSee Also\n--------\nisinf : Shows which elements are positive or negative infinity.\nisneginf : Shows which elements are negative infinity.\nisposinf : Shows which elements are positive infinity.\nisnan : Shows which elements are Not a Number (NaN).\nisfinite : Shows which elements are finite (not NaN, not infinity)\n\nNotes\n-----\nNumPy uses the IEEE Standard for Binary Floating-Point for Arithmetic\n(IEEE 754). This means that Not a Number is not equivalent to infinity.\n\nExamples\n--------\n>>> import numpy as np\n>>> np.nan_to_num(np.inf)\n1.7976931348623157e+308\n>>> np.nan_to_num(-np.inf)\n-1.7976931348623157e+308\n>>> np.nan_to_num(np.nan)\n0.0\n>>> x = np.array([np.inf, -np.inf, np.nan, -128, 128])\n>>> np.nan_to_num(x)\narray([ 1.79769313e+308, -1.79769313e+308,  0.00000000e+000, # may vary\n       -1.28000000e+002,  1.28000000e+002])\n>>> np.nan_to_num(x, nan=-9999, posinf=33333333, neginf=33333333)\narray([ 3.3333333e+07,  3.3333333e+07, -9.9990000e+03,\n       -1.2800000e+02,  1.2800000e+02])\n>>> nan = np.array([11, 12, -9999, 13, 14])\n>>> posinf = np.array([33333333, 11, 12, 13, 14])\n>>> neginf = np.array([11, 33333333, 12, 13, 14])\n>>> np.nan_to_num(x, nan=nan, posinf=posinf, neginf=neginf)\narray([ 3.3333333e+07,  3.3333333e+07, -9.9990000e+03, -1.2800000e+02,\n        1.2800000e+02])\n>>> y = np.array([complex(np.inf, np.nan), np.nan, complex(np.nan, np.inf)])\narray([  1.79769313e+308,  -1.79769313e+308,   0.00000000e+000, # may vary\n     -1.28000000e+002,   1.28000000e+002])\n>>> np.nan_to_num(y)\narray([  1.79769313e+308 +0.00000000e+000j, # may vary\n         0.00000000e+000 +0.00000000e+000j,\n         0.00000000e+000 +1.79769313e+308j])\n>>> np.nan_to_num(y, nan=111111, posinf=222222)\narray([222222.+111111.j, 111111.     +0.j, 111111.+222222.j])\n>>> nan = np.array([11, 12, 13])\n>>> posinf = np.array([21, 22, 23])\n>>> neginf = np.array([31, 32, 33])\n>>> np.nan_to_num(y, nan=nan, posinf=posinf, neginf=neginf)\narray([21.+11.j, 12. +0.j, 13.+23.j])"
"virtual_ecosystem.models.abiotic.wind.calculate_zero_plane_displacement" = "Calculate zero plane displacement height.\n\nThe zero plane displacement height is a concept used in micrometeorology to describe\nthe flow of air near the ground or over surfaces like a forest canopy or crops. It\nrepresents the height above the actual ground where the wind speed is theoretically\nreduced to zero due to the obstruction caused by the roughness elements (like trees\nor buildings). Implementation after :cite:t:`maclean_microclimc_2021`.\n\nArgs:\n    canopy_height: Canopy height, [m]\n    leaf_area_index: Total leaf area index, [m m-1]\n    zero_plane_scaling_parameter: Control parameter for scaling d/h, dimensionless\n        :cite:p:`raupach_simplified_1994`\n    denominator_tolerance: Minimum value for denominator to avoid division by zero"
"virtual_ecosystem.models.abiotic.wind.calculate_wind_profile" = "Calculate wind speed profile.\n\nThe wind speed at different heights is calculated using the following equation\n(based on :cite:t:`holmes_wind_2019`):\n\n.. math::\n    u(z) = u_{ref} \\times \\frac{ \\ln \\left( \\frac{z - d}{z_0} \\right) }\n                            { \\ln \\left( \\frac{z_{ref} - d}{z_0} \\right) }\n\nwhere :math:`u(z)` is the wind speed at height :math:`z`, :math:`u_{ref}` is the\nreference wind speed at reference height :math:`z_{ref}`, :math:`z` is the height at\nwhich the wind speed is calculated, :math:`z_0` is the roughness length, and\n:math:`d` is the zero plane displacement.\n\nArgs:\n    reference_wind_speed: Reference wind speed above the canopy, [m s-1].\n    reference_height: Reference height above the canopy, [m].\n    wind_heights: Heights where wind speed is to be calculated, [m].\n    roughness_length: Momentum roughness length, [m]\n    zero_plane_displacement: Height above the actual ground where the wind speed is\n        theoretically reduced to zero due to the obstruction caused by the roughness\n        elements (like trees or buildings), [m]\n    min_wind_speed: Minimum wind speed to avoid division by zero, [m s-1]\n    denominator_tolerance: Minimum value for denominator to avoid division by zero"
"virtual_ecosystem.models.abiotic.abiotic_model.AbioticModel._setup" = "Function to set up the abiotic model.\n\nThis function initializes soil temperature and canopy temperature for all\ncorresponding layers and calculates the reference vapour pressure deficit for\nall time steps of the simulation. All variables are added directly to the\nself.data object.\n\nSee __init__ for argument descriptions."
"virtual_ecosystem.models.abiotic.energy_balance.initialise_canopy_and_soil_fluxes" = "Initialise canopy temperature and energy fluxes.\n\nThis function initializes the following variables to run the first step of the\nenergy balance routine: sensible and latent heat flux (canopy and soil), ground\nheat flux, and absorbed longwave radiation, all in [W m-2].\n\nArgs:\n    air_temperature: Air temperature, [C]\n    layer_structure: Instance of LayerStructure\n    light_extinction_coefficient: Light extinction coefficient for canopy, unitless\n    initial_flux_value: Initial non-zero flux, [W m-2]"
"virtual_ecosystem.models.abiotic.microclimate.generate_hourly_forcing" = "Generate hourly profiles for atmospheric forcing variables.\n\nThis function generates a diurnal cycle of air temperature, shortwave absorption,\nrelative humidity, evapotranspiration, and soil evaporation. This diurnal cycle is\ngenerated from monthly data using a sinusoidal function.\n\nArgs:\n    data: Data object\n    static: Dictionary with prepared static inputs for microclimate model\n    time_index: Time index\n    month: Current month (1-12)\n    days: Number of days per month\n    latitude: Latitude of the location, [degrees]\n    abiotic_constants: Set of constants for abiotic model"
"virtual_ecosystem.models.abiotic.energy_balance.calculate_total_absorbed_shortwave_radiation" = "Compute total absorbed shortwave radiation contributing to leaf energy balance.\n\nShortwave (SW) radiation is partitioned into:\n  - PAR (photosynthetically active radiation)\n  - non-PAR (primarily near-infrared, NIR)\n\nThe plant model provides absorbed PAR. A fraction of this PAR is used\nin photosynthesis, while the remainder contributes to heat. Non-PAR radiation\nis assumed not to be used in photosynthesis and contributes entirely to heat\nafter accounting for leaf absorptance.\n\nThis function calculates the total absorbed shortwave radiation that contributes to\nthe leaf energy balance by combining the absorbed PAR (adjusted for photosynthesis)\nand the absorbed non-PAR radiation (adjusted for leaf absorptance and vertical\ndistribution).\n\nArgs:\n    downward_shortwave_radiation: Incoming shortwave radiation [W m-2]\n    shortwave_absorption_by_canopy: Absorbed PAR by canopy [W m-2]\n    fraction_par_used: Fraction of absorbed PAR used in photosynthesis (0-1).\n    leaf_absorptance_non_par: Fraction of non-PAR radiation absorbed by the leaf\n        (0-1).\n    par_fraction: Fraction of total shortwave radiation that is PAR (0-1)."
"virtual_ecosystem.models.abiotic.microclimate.calculate_vegetation_temperature" = "Calculate canopy and understorey temperature for microclimate model.\n\nThis uses the energy balance equation to solve for canopy and understorey\ntemperature based on absorbed radiation, evapotranspiration, aerodynamic resistance,\nand other thermodynamic variables.\n\nArgs:\n    state: Current state variables for microclimate model\n    static: Prepared static inputs for microclimate model\n    abiotic_constants: Set of constants for abiotic model\n    core_constants: Set of constants that are shared across all models\n    idx: SimpleNamespace with layer indices"
"virtual_ecosystem.models.abiotic.energy_balance.secant_solve_cells_layers" = "Vectorised secant solver for independent (layers, cell_id) root problems.\n\nThe function returns solver diagnostics to the log file if the solution does not\nconverge.\n\nArgs:\n    residual_function: Function f(T) returning residual with same shape as T.\n    initial_guess: Initial guess canopy temperature with dims ('layers', 'cell_id').\n    maxiter_secant: Maximum secant iterations.\n    convergence_tolerance: Convergence tolerance on max absolute update.\n    small_perturbation_second_guess: Small perturbation for second initial guess.\n    denominator_tolerance: Small value to prevent division by zero in secant update."
"virtual_ecosystem.models.abiotic.wind.calculate_ventilation_rate" = "Calculate ventilation rate from the top of the canopy to atmosphere above.\n\nThis function calculates the rate of water and heat exchange between the top of the\ncanopy and the atmosphere above after :cite:t:`wolfe_forest_2011`.\n\nIf the canopy height is zero, the value is set to a default value for understorey\nventilation.\n\nArgs:\n    aerodynamic_resistance: Aerodynamic resistance, [s m-1]\n    characteristic_height: Vertical scale of exchange, typically canopy height +\n        zero plane displacement height [m]\n    understorey_ventilation_rate: Understorey ventilation rate, [s-1]. This is used\n        in case there is no canopy.\n    surface_layer_height: Height of the surface layer, [m]\n    denominator_tolerance: Minimum value for denominator to avoid division by zero"
"virtual_ecosystem.models.hydrology.below_ground.calculate_matric_potential" = "Convert soil moisture into an estimate of water potential.\n\nThis function estimates soil water potential :math:`\\Psi_{m}` as using the van\nGenuchten - Mualem model\n(:cite:t:`van_genuchten_closed-form_1980`, :cite:t:`mualem_new_1976`):\n\n.. math ::\n    \\Psi_{m} = -\\frac{1}{\\alpha} (S_{e}^{-\\frac{1}{m}} - 1)^{(\\frac{1}{n})}\n\nwhere :math:`\\alpha` is the inverse of the air-entry , :math:`S_{e}` is the\neffective saturation, n and m are van Genuchten parameters.\n\nArgs:\n    effective_saturation: Effective saturation\n    air_entry_potential_inverse: Inverse of air entry potential (parameter alpha in\n        van Genuchten), [m-1]\n    van_genuchten_nonlinearity_parameter: Dimensionless parameter in van Genuchten\n        model that describes the degree of nonlinearity of the relationship between\n        the volumetric water content and the soil matric potential.\n    denominator_tolerance: Small value to avoid division by zero"
"virtual_ecosystem.models.abiotic.wind.mix_and_ventilate" = "Apply vertical mixing and top-layer ventilation across multiple vertical layers.\n\nThis function simulates diffusion-like mixing between vertical layers based on local\ngradients of atmospheric variables (e.g. temperature, relative humidity) and\nlayer-specific mixing coefficients. For each layer, it computes upward and\ndownward fluxes using the nearest valid (finite) values above.\n\nAdditionally, the function applies a ventilation adjustment to the top layer of each\ncolumn, representing heat or water exchange with the  above the canopy. This is\nbased on the difference between the top and next valid layer, scaled by a\nuser-provided ventilation rate, with optional limits to prevent overcorrection or\nnegative concentrations.\n\nAdvection is currently not implemented as everything is removed with time interval\n> 1h and horizontal transfer is not implemented.\n\nArgs:\n    input_variable: Input variable for all true atmospheric layers\n    mixing_coefficient: Turbulent mixing coefficients for canopy, [m2 s-1]\n    ventilation_rate: Ventilation rate, [s-1]\n    limits: Upper and lower limit for input variable, avoid overshoot when mixing\n    surface_index: Surface layer index"
"virtual_ecosystem.models.abiotic.abiotic_tools.calculate_atmospheric_layer_geometry" = "Calculate heights, layer thickness, and midpoints for atmospheric layers.\n\nThe midpoint values are distances in metres above ground for each cell.\nFor layer heights below the surface layer, a minimum mixing depth is introduced.\nThis is to prevent unrealistically low mixing depths and therefore high temperatures\nin the lowest canopy layer when the layer height is very low. Note that this is an\nartificial inflation of the mixing depth.\n\nArgs:\n    data: Data object\n    idx: SimpleNamespace containing layer indices\n    minimum_mixing_depth: Minimum depth for lowest canopy layer, [m]"
"builtins.min" = "min(arg1: _T, arg2: _T, /, *_args: _T, key: Callable[[_T], SupportsRichComparison]) -> _T\nmin(iterable: Iterable[SupportsRichComparisonT], /, *, key: None=None) -> SupportsRichComparisonT\nmin(iterable: Iterable[_T], /, *, key: Callable[[_T], SupportsRichComparison]) -> _T\nmin(iterable: Iterable[SupportsRichComparisonT], /, *, key: None=None, default: _T) -> SupportsRichComparisonT | _T\nmin(iterable: Iterable[_T1], /, *, key: Callable[[_T1], SupportsRichComparison], default: _T2) -> _T1 | _T2\n\nmin(iterable, *[, default=obj, key=func]) -> value\nmin(arg1, arg2, *args, *[, key=func]) -> value\n\nWith a single iterable argument, return its smallest item. The\ndefault keyword-only argument specifies an object to return if\nthe provided iterable is empty.\nWith two or more positional arguments, return the smallest argument."
"virtual_ecosystem.models.abiotic_simple.microclimate_simple.exp_interpolation" = "LAI regression and exponential interpolation of variables above ground.\n\nArgs:\n    reference_data: Input variable at reference height\n    leaf_area_index_sum: Leaf area index summed over all canopy layers, [m m-1]\n    layer_structure: The LayerStructure instance for the simulation.\n    layer_heights: Vertical layer heights, [m]\n    measurement_height: Height at which to interpolate the variable, [m]\n    lower_bound: Minimum allowed value, used to constrain exp interpolation. Note\n        that currently no conservation of water and energy!\n    upper_bound: Maximum allowed value, used to constrain exp interpolation.\n    gradient: Gradient of regression from :cite:t:`hardwick_relationship_2015`"
"virtual_ecosystem.models.abiotic_simple.microclimate_simple.log_interpolation" = "LAI regression and logarithmic interpolation of variables above ground.\n\nArgs:\n    reference_data: Input variable at reference height\n    leaf_area_index_sum: Leaf area index summed over all canopy layers, [m m-1]\n    layer_structure: The LayerStructure instance for the simulation.\n    layer_heights: Vertical layer heights, [m]\n    measurement_height: Height at which to interpolate the variable, [m]\n    lower_bound: Minimum allowed value, used to constrain log interpolation. Note\n        that currently no conservation of water and energy!\n    upper_bound: Maximum allowed value, used to constrain log interpolation.\n    gradient: Gradient of regression from :cite:t:`hardwick_relationship_2015`"
"virtual_ecosystem.models.abiotic_simple.abiotic_simple_model.AbioticSimpleModel._setup" = "Function to set up the abiotic simple model.\n\nThis function initializes soil temperature for all soil layers and calculates\nthe reference vapour pressure deficit for all time steps. Both variables are\nadded directly to the self.data object.\n\nTODO - Unlike the abiotic model this init does not populate initial values for\nthe air temperatures. This is something that might need to be reconsidered in\nfuture.\n\nSee __init__ for argument descriptions."
"virtual_ecosystem.models.animal.functional_group.import_functional_groups" = "The function to import pre-defined functional groups.\n\nThis function is a first-pass of how we might import pre-defined functional groups,\nthe specific options of which can be found in functional_group.py.\nThis allows a user to set out a basic outline of functional groups that accept our\ndefinitions of parameters and scaling relationships based on those traits.\n\nTODO: A structure for user-selection of which traits to employ.\nTODO: density test\n\nArgs:\n    fg_csv_file: The location of the csv file holding the functional group\n        definitions.\n    constants:  An object providing animal model constants."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.metabolize" = "The function to reduce body carbon mass through metabolism.\n\nThis method reduces the carbon component of the cohort's body mass through\nmetabolic activity. Metabolism is a function of environmental temperature\nfor ectotherms, while endotherms are unaffected by temperature changes.\n\nTODO: Update with stoichiometry for nitrogen and phosphorus.\n\nArgs:\n    temperature: Current air temperature (K).\n    dt: Number of days over which the metabolic costs should be calculated."
"virtual_ecosystem.models.animal.scaling_functions.metabolic_rate" = "metabolic_rate(mass: float, temperature: float, terms: dict, metabolic_type: MetabolicType, sigma_f_t: float, metabolic_scaling_coefficients: tuple[\n        float, float\n    ]=AnimalConstants().metabolic_scaling_coefficients, boltzmann_constant: float=AnimalConstants().BOLTZMANN_CONSTANT) -> float\n\nCalculates metabolic rate in grams of body mass per day.\n\nThis follows the Madingley implementation, assuming a power-law relationship with\nmass and an exponential relationship with temperature.\n\n.. math::\n    \\Delta M_i^{metab} = E_S \\left[\n        \\varsigma_{f(t)} \\cdot I_{0,f}^{FMR}\n            \\cdot e^{-E_A / k_B T^{K,body}} \\cdot M_{i(t)}^{b_f^{FMR}}\n        + (1 - \\varsigma_{f(t)}) \\cdot I_0^{BMR}\n            \\cdot e^{-E_A / k_B T^{K,body}} \\cdot M_{i(t)}^{b^{BMR}}\n    \\right] \\Delta t_d\n\nArgs:\n    mass: The body-mass [kg] of an AnimalCohort.\n    temperature: The temperature [Celsius] of the environment.\n    terms: The tuple of metabolic rate terms used.\n    metabolic_type: The metabolic type of the animal [ENDOTHERMIC or ECTOTHERMIC].\n    sigma_f_t: Activity window fraction in [0, 1].\n    metabolic_scaling_coefficients: A 2-tuple of - the energy-to-\n        mass conversion constant and the aggregate activation energy of metabolic\n        reactions.\n    boltzmann_constant: The Boltzmann constant ($k_B$)"
"virtual_ecosystem.models.animal.scaling_functions" = "The `models.animal.scaling_functions` module contains a set of functions containing\nscaling equations\" (relationships between body-mass and a trait) required by the broader\n:mod:`~virtual_ecosystem.models.animal` module"
"virtual_ecosystem.models.animal.animal_model.AnimalModel._setup" = "Method to setup the animal model specific data variables.\n\nThis method initializes the data variables required by the animal model.\nMicrobial stoichiometries have to be supplied so that the availability of\nnutrients to soil consuming taxa can be found.\n\nTODO: There are concerns about the sequence of method calls that fixed the\n    active_cohorts bug. Dig in an see what is going on with when setup is called\n    in relation to the rest of init.\n\nSee __init__ for argument descriptions."
"virtual_ecosystem.models.animal.model_config.AnimalConstants.get_population_density_terms" = "Return scaling terms for the specified density scaling method.\n\nArgs:\n    taxa: The TaxaType of the functional group (used for damuth).\n    diet: The DietType of the functional group (used for damuth)."
"virtual_ecosystem.models.animal.functional_group.FunctionalGroup.__init__" = "The constructor for the FunctionalGroup class.\n\nTODO: Remove unused attributes.\nTODO: density test"
"virtual_ecosystem.models.animal.animal_model.AnimalModel.birth_community" = "This handles birth for all cohorts in a community."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.is_below_mass_threshold" = "Check if cohort's total mass is below a certain threshold.\n\nCurrently used for thesholding: birth, dispersal, trophic flow to reproductive\nmass.\n\nArgs:\n    mass_threshold: a float value holding a threshold ratio of current total\n        mass to standard adult mass.\n\nReturn:\n    A bool of whether the current mass state is above the migration threshold."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.grow" = "Handles growth based on resource intake, enforcing stoichiometry.\n\nGrowth is limited by whichever element is scarcest relative to the cohort's\nfixed C:N:P body proportions; the remainder is returned as stoichiometric\nwaste.\n\n``resource_intake`` is a cohort-total quantity: the individuals scaling is\napplied upstream in ``F_i_k`` and ``F_i_j_individual``, so the mass arriving\nhere is the sum across all individuals in the cohort. ``mass_cnp`` and\n``reproductive_mass_cnp``, by contrast, hold the masses of a *single*\nindividual. The mass used for growth is therefore divided by\n``self.individuals`` before being added, while the returned waste stays at\ncohort scale for the downstream waste pools.\n\nFollowing Madingley eq. 8, growth that would take body mass beyond the\nallocation ceiling (``flow_to_reproductive_mass_threshold`` x adult mass) is\nstored as reproductive mass instead. Non-reproductive groups keep all growth\nin the body, so that larvae can reach their metamorphosis mass.\n\nArgs:\n    resource_intake: The cohort-total mass of C, N, and P available for\n        growth [kg]."
"virtual_ecosystem.models.animal.animal_model.AnimalModel.migrate_community" = "This handles migrating all cohorts with a centroid in the community.\n\nThis migration method initiates migration for three reasons:\n1) The cohort is starving and needs to move for a chance at resource access\n2) An initial migration event immediately after birth.\n3) Thermal escape with a suitability-weighted destination when the toggle is on.\n\nThe destination is drawn uniformly from the cells the cohort can actually\nreach within its mass-scaled dispersal distance, rather than from the\nimmediately adjacent cells alone. Cohorts too slow to clear a single cell\nstill move one cell when dispersal is triggered, as the dispersal probability\nalready scales with distance.\n\nArgs:\n    dt: The time passed in the timestep."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.forage_cohort" = "Coordinate all resource consumption for a single cohort.\n\nThis wrapper collects every resource class the cohort can exploit\n(plants, prey, litter, carcasses, excrement) and calls the\nspecialised *delta_mass_* helpers.  It also passes the full\ndeposition pools (`excrement_pools`, `carcass_pool_map`) so that\nwaste and carcass remains are always routed correctly, even if the\ncohort is not actively scavenging.\n\nEach helper returns the ingested mass already split by\n``conversion_efficiency`` into an assimilated fraction, available for growth,\nand an unassimilated fraction, which passes through the gut to the excrement\npools. Both are accumulated across all resource classes and handed to ``eat``\ntogether. All accumulated masses are cohort-total: the individuals scaling\nenters in ``F_i_k`` and ``F_i_j_individual``.\n\nArgs:\n    array_resource_list: Full set of resources available through the array\n        resources interface, at present this consists of the living plants and\n        dead plant detritus (litter).\n    animal_list: Live prey cohorts available for predation.\n    soil_fungi_list: Soil fungi pools (not fruiting bodies).\n    pom_list: Soil particulate organic matter pools (POM).\n    bacteria_list: Soil bacteria pools.\n    excrement_pools: ExcrementPool objects used for defecation\n        deposition.\n    carcass_pool_map: Mapping ``cell_id → list[CarcassPool]`` that\n        receives carcass remains created during predation.\n    scavenge_carcass_pools: Subset of `CarcassPool` objects in the\n        territory from which the cohort will attempt to scavenge.\n    scavenge_excrement_pools: Subset of `ExcrementPool` objects in\n        the territory that the cohort will consume via coprophagy.\n    herbivory_waste_pools: Mapping ``cell_id → HerbivoryWaste`` for\n        litter generated by partial plant consumption.\n    dt: Time (D) in the time step."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_alpha" = "Calculate search efficiency.\n\nThis utilizes the alpha_i_k scaling function to determine the effective rate at\nwhich an individual herbivore searches its environment, factoring in the\nherbivore's current mass.\n\nTODO: update name"
"virtual_ecosystem.models.animal.scaling_functions.alpha_i_k" = "Effective rate at which an individual herbivore searches its environment.\n\nLinear scaling of herbivore search rate with current body mass (Madingley).\nThe native Madingley constant ``alpha_0_herb`` is in ha day^-1 g^-1, so the\nkg body mass is converted to grams before applying it; the returned search\nrate is therefore in native ha/day. Area is not converted here -- it enters\nthe functional response in ``k_i_k``, where ``A_cell`` is the normaliser.\n\nTODO: Update name\n\nArgs:\n    alpha_0_herb: Native Madingley effective search rate per unit body mass\n        [ha day^-1 g^-1], value 1e-11.\n    mass: Current body mass of the foraging herbivore [kg]."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_predation_search_rate" = "Calculate the search rate of the predator.\n\nArgs:\n    w_bar: Probability of successfully capturing prey."
"virtual_ecosystem.models.animal.scaling_functions.alpha_i_j" = "Rate at which an individual predator searches its environment and kills prey.\n\nLinear scaling of predator search rate with current body mass (Madingley),\nweighted by capture success. The native constant ``alpha_0_pred`` is in\nha day^-1 g^-1, so the kg body mass is converted to grams before applying it;\nthe returned rate is native ha/day. Area is not converted here -- it enters the\nfunctional response in ``k_i_j``.\n\nTODO: Update name\n\nArgs:\n    alpha_0_pred: Native Madingley search rate per unit body mass\n        [ha day^-1 g^-1], value 1e-6.\n    mass: Current body mass of the foraging predator [kg].\n    w_bar_i_j: Probability of successfully capturing a prey item [0-1]."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_total_handling_time_for_predation" = "Calculate the total handling time term for the predation functional response.\n\nComputes the denominator sum ∑(K_i,m · H_i,m) from Equations 28/29 of\nHarfoot et al. (2014), which represents the total time in days, per day\nspent searching, that would be taken to handle all potential prey items\nacross all prey cohorts. This is dimensionless (days of handling per day\nof searching) and forms the saturation term in the Holling Type III\ndenominator: 1 + ∑(K_i,m · H_i,m).\n\nArgs:\n    animal_list: All prey cohorts available to the predator.\n    theta_opt: The predator's optimum prey-predator mass ratio for this\n        encounter, drawn once per encounter in delta_mass_predation.\n    bin_densities: Pre-computed mapping of mass bin index to cumulative\n        prey density, built once per encounter by _build_prey_bin_densities.\n    intersection_areas: Pre-computed mapping of prey cohort id to territory\n        intersection area in m², built once per encounter in\n        delta_mass_predation."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_total_handling_time_for_herbivory" = "Calculate total handling time across all plant resources.\n\nComputes the denominator sum Σ K_i,l · H_i,l from the Holling Type III\nfunctional response,\n\nArgs:\n    plant_list: A list of plant resources available for consumption by the\n        cohort.\n    alpha: The search efficiency rate of the herbivore cohort."
"virtual_ecosystem.models.animal.scaling_functions.H_i_k" = "Handling time for a herbivore of cohort i to handle 1 g of plant resource k.\n\n``H_i,k = h_herb_0 * (M_ref / M_i_t)^b_herb`` in native Madingley units. The\nratio M_ref/M_i_t only cancels its unit if both masses match, so the kg\nherbivore mass is converted to grams to sit against the native gram M_ref --\nthis is the fractional-power term, safe because b_herb acts on a dimensionless\nratio. M_ref stays in its native grams.\n\n(Madingley)\n\nTODO: update name\n\nArgs:\n    h_herb_0: Native time for a reference-mass herbivore to handle 1 g of\n        autotroph mass [days].\n    M_ref: Native herbivore reference mass [g].\n    M_i_t: Current herbivore mass [kg].\n    b_herb: Exponent of the power-law relating handling time of autotroph\n        matter to herbivore mass [-]."
"virtual_ecosystem.models.animal.scaling_functions.H_i_j" = "Handling time of one prey individual of cohort j by cohort i.\n\n``H_i,j = h_pred_0 * (M_ref / M_i_t)^b_pred * prey_mass`` in native units. The\nratio M_ref/M_i_t only cancels its unit if both masses match, so the kg predator\nmass is converted to grams to sit against the native gram M_ref -- this is the\nfractional-power term, safe because b_pred acts on a dimensionless ratio.\nprey_mass is a power-1 factor in native grams, so it converts by a clean kg -> g.\n\nTODO: Update name\n\nArgs:\n    h_pred_0: Native time for a reference-mass predator to handle a 1 g prey\n        individual [days], default value 0.5.\n    M_ref: Native predator reference mass [g].\n    M_i_t: Current predator mass [kg].\n    b_pred: Exponent of the handling-time power law [-].\n    prey_mass: Mass of the prey individual being handled [kg]."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort._mass_bin" = "Calculate the predator-specific mass bin index for a prey cohort.\n\nImplements Equation 39 of Harfoot et al. (2014). Assigns a prey cohort\nto a discrete bin based on its log mass ratio to the predator, normalised\nby the prey preference width, offset to ensure non-negative bin indices.\n\nArgs:\n    prey_mass: Current body mass of the prey cohort in kg.\n    theta_opt: This predator's optimal prey-predator mass ratio for this\n        foraging encounter, drawn once per encounter in delta_mass_predation."
"builtins.round" = "round(number: _SupportsRound2[_T], ndigits: SupportsIndex) -> _T\n\nRound a number to a given precision in decimal digits.\n\nThe return value is an integer if ndigits is omitted or None.  Otherwise\nthe return value has the same type as the number.  ndigits may be negative."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_predation_success_probability" = "Calculate the probability of a successful predation event.\n\nArgs:\n    M_target: the body mass of the animal cohort being targeted for predation."
"virtual_ecosystem.models.animal.scaling_functions.w_bar_i_j" = "The probability of successfully capturing a prey item.\n\nTODO: update name\n\nMadingley\n\nArgs:\n    mass_predator: Current mass of the predator..\n    mass_prey: Current mass of the prey.\n    theta_opt_i: The optimum predator-prey mass ratio.\n    sigma_opt_pred_prey: The standard deviation of the mass ratio."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.F_i_j_individual" = "Method to determine instantaneous predation rate on cohort j.\n\nImplements the Holling type III functional response for predation. All\nencounter-level quantities (theta_opt, bin_densities, total_handling_time)\nare pre-computed once per encounter in delta_mass_predation and passed in\nto avoid redundant recomputation across prey.\n\nArgs:\n    target_cohort: The prey cohort from which mass will be consumed.\n    intersection_area: Pre-computed overlap area between predator and target\n        territories in m2.\n    theta_opt: This predator's optimal prey-predator mass ratio, drawn once\n        per encounter in delta_mass_predation.\n    bin_densities: Pre-computed mapping of mass bin index to cumulative prey\n        density, built once per encounter by _build_prey_bin_densities.\n    total_handling_time: Pre-computed Holling type III denominator sum\n        ∑(K_i,m · H_i,m), built once per encounter in delta_mass_predation."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.calculate_theta_opt_i" = "Calculate the optimal predation param based on predator-prey mass ratio.\n\nTODO: update name"
"virtual_ecosystem.models.animal.scaling_functions.theta_opt_i" = "Optimum predator-prey mass ratio.\n\nTODO: update name\n\nMadingley\n\nArgs:\n    theta_opt_min_f: The minimum optimal prey-predator body mass ratio.\n    theta_opt_f: The mean optimal prey-predator body mass ratio, from which actual\n        cohort optima are drawn.\n    sigma_opt_f: The standard deviation of optimal predator-prey mass ratios among\n      cohorts."
"virtual_ecosystem.models.animal.scaling_functions.activity_window" = "Proportion of the timestep suitable for a cohort to be active.\n\nImplements Madingley eqs. 41-47:\n\n* Endotherms are active for the full timestep (eq. 41).\n* Terrestrial ectotherms are limited to the fraction of the day within their\n  thermal tolerance window, derived from the diurnal temperature cycle and\n  climatological statistics (eq. 42).\n\n.. math::\n\n    \\\\varsigma_{f(t)} = \\\\begin{cases}\n        1 & \\\\text{if } f \\\\text{ is endotherm} \\\\\\\\\n        1 - (p_{Above,f} + p_{Below,f}) & \\\\text{if } f \\\\text{ is ectotherm}\n    \\\\end{cases}\n\nThe result is clamped to [0, 1] to guard against floating-point cases where\n``p_above + p_below`` marginally exceeds 1.\n\nIf ``t_opt``, ``t_max_crit``, and ``t_min_crit`` are all provided they are\nused directly, bypassing the toy-parameter derivation from climate statistics.\nIf any are ``None`` the full derivation from ``annual_mean_temp`` and\n``annual_temp_sd`` is used instead.\n\nArgs:\n    metabolic_type: Whether the cohort is endothermic or ectothermic.\n    temperature: Monthly mean ambient temperature $T_C$ [°C].\n    diurnal_temp_range: Monthly mean diurnal temperature range\n        $\\\\Delta T_{Diurnal}^C$ [°C].\n    annual_mean_temp: Annual mean ambient temperature $T_{Annual}^C$ [°C].\n    annual_temp_sd: Standard deviation of monthly temperatures across the\n        climatological year $\\\\sigma_{T_{Annual}^C}$ [°C].\n    t_opt: Optional optimal activity temperature [°C]. If provided alongside\n        ``t_max_crit`` and ``t_min_crit``, overrides the toy-parameter\n        derivation.\n    t_max_crit: Optional upper critical temperature [°C]. See ``t_opt``.\n    t_min_crit: Optional lower critical temperature [°C]. See ``t_opt``.\n    constants: Animal constants supplying the four activity window parameters,\n        used only when ``t_opt``, ``t_max_crit``, and ``t_min_crit`` are not\n        all provided."
"virtual_ecosystem.models.animal.scaling_functions.t_max_crit_ectotherm" = "Upper critical temperature for a terrestrial ectothermic functional group.\n\nImplements Madingley eq. 45:\n\n.. math::\n\n    T_{\\\\max,f}^{crit} = m_{tol,terrestrial} \\\\cdot \\\\sigma_{T_{Annual}^C}\n        + c_{tol,terrestrial} + T_{Annual}^C\n\nArgs:\n    annual_mean_temp: Annual mean ambient temperature $T_{Annual}^C$ [°C].\n    annual_temp_sd: Standard deviation of monthly temperatures across the\n        climatological year $\\\\sigma_{T_{Annual}^C}$ [°C].\n    m_tol: Slope of the variability-upper-critical-temperature relationship.\n    c_tol: Intercept of the variability-upper-critical-temperature\n        relationship [°C]."
"virtual_ecosystem.models.animal.scaling_functions.t_opt_ectotherm" = "Optimal activity temperature for a terrestrial ectothermic functional group.\n\nImplements Madingley eq. 47:\n\n.. math::\n\n    T_{opt} = m_{tsm} \\\\cdot \\\\sigma_{T_{Annual}^C} + c_{tsm} + T_{Annual}^C\n\nArgs:\n    annual_mean_temp: Annual mean ambient temperature $T_{Annual}^C$ [°C].\n    annual_temp_sd: Standard deviation of monthly temperatures across the\n        climatological year $\\\\sigma_{T_{Annual}^C}$ [°C].\n    m_tsm: Slope of the variability-optimal temperature relationship.\n    c_tsm: Intercept of the variability-optimal temperature relationship [°C]."
"virtual_ecosystem.models.animal.functional_group._resolve_reference_annual_climate" = "Average the placeholder annual temperature terms across occupied strata.\n\nThe annual mean temperature and its standard deviation that a functional group\nis adapted to are taken as the unweighted mean, across the strata the group\noccupies, of the per-stratum placeholder terms. This mirrors the unweighted\nstratum averaging applied to the *experienced* climate in\n:meth:`~virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.get_stratum_climate`,\nkeeping the reference and experienced climates on the same footing.\n\nNote:\n    Averaging the standard deviation across strata is a placeholder\n    simplification, not a statistically rigorous pooling of variances. It is\n    harmless while the per-stratum values are equal, but is the first term to\n    revisit once strata carry genuinely different variability.\n\nArgs:\n    vertical_occupancy: The combined vertical occupancy flag of the functional\n        group, spanning one or more atomic strata.\n    placeholder_annual_temp_terms: Per-stratum placeholder terms keyed by atomic\n        :class:`~virtual_ecosystem.models.animal.animal_traits.VerticalOccupancy`\n        member, each providing ``\"mean_temp\"`` and ``\"temp_sd\"`` [°C]."
"virtual_ecosystem.models.animal.animal_model.AnimalModel._update_thermal_suitability" = "Rebuild the per-functional-group thermal suitability grid.\n\nComputes, for each functional group, the per-cell activity window it would\nexperience given the current stratum climate. The result is cached on\n:attr:`thermal_suitability` and consumed by both dispersal and territory\nconstruction.\n\nLeaves :attr:`thermal_suitability` as ``None`` when thermal habitat selection\nis disabled, so that dispersal falls through to uniform destination choice.\n\nArgs:\n    climate: Per-cell, per-stratum climate for the current timestep, as built\n        by :meth:`_build_stratum_climate`."
"virtual_ecosystem.models.animal.animal_model.AnimalModel._select_destination" = "Pick a destination cell from the reachable set.\n\nUniform when thermal habitat selection is off; otherwise weighted by each\nreachable cell's suitability for the cohort's functional group, raised to\n``thermal_selection_exponent`` and floored at ``thermal_suitability_floor`` so\nthe distribution stays valid even where every reachable cell is lethal."
"numpy.maximum" = ""
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.get_dispersal_distance" = "The distance this cohort can travel in one timestep [m].\n\nArgs:\n    dt_days: Length of the model timestep [days]."
"virtual_ecosystem.models.animal.scaling_functions.dispersal_distance" = "Distance a cohort can travel in a single timestep [m].\n\nMadingley eq. (diffusive natal dispersal). ``V_disp`` is the dispersal speed of\nan individual of reference body mass, expressed in the Madingley-native units of\nkm/month, and ``M_disp_ref`` is that reference mass in grams. ``current_mass`` is\nsupplied in kg and is converted to grams at the point it enters the mass ratio,\nand the km/month speed is converted to metres over the model timestep.\n\nArgs:\n    current_mass: Mass of an individual of the cohort in the current timestep [kg].\n    V_disp: Dispersal speed of an individual of mass ``M_disp_ref`` [km/month].\n    M_disp_ref: Reference body mass for the dispersal speed scaling [g].\n    o_disp: Power-law exponent for the mass-dispersal speed scaling relationship.\n    dt_days: Length of the model timestep [days]."
"virtual_ecosystem.models.animal.animal_model.AnimalModel.calculate_semelparous_mass_loss" = "Calculate the mass lost by a semelparous parent after reproduction.\n\nIf the species is not semelparous, returns zero loss.\n\nArgs:\n    parent: The parent cohort."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.inflict_non_predation_mortality" = "Inflict combined background, senescence, and starvation mortalities.\n\nThe number of deaths is drawn from a binomial distribution with trial size\n``pop_size`` and per-individual death probability ``1 - exp(-u_t * dt)`` where\n``u_t`` is the sum of background, senescence, and starvation mortality rates.\n\nArgs:\n    dt: The time passed in the timestep (days).\n    carcass_pools: The local carcass pool to which dead individuals go."
"virtual_ecosystem.models.animal.scaling_functions.background_mortality" = "Constant background rate of wastebasket mortality.\n\nThis function does nothing but return a constant at the moment.\nI am leaving it in so there is a clear way to alter the assumptions about\nbackground mortality as we move into testing and validation.\n\nMadingley\n\nArgs:\n    u_bg: The constant of background mortality [day^-1]."
"virtual_ecosystem.models.animal.scaling_functions.senescence_mortality" = "Age-based mortality.\n\nMadingley describes the equation as exp(time_to_maturity/time_since_maturity) but I\nsuspect this is an error and that it should be inverted. If, for example, it took\n1000 days to reach maturity and the cohort had been mature for 1 day, then the\ninstantaneous rate of senescence mortality would be lambda_se * exp(1000/1). This\nwould also mean that the rate of senescence would decrease over time. Therefore, I\nhave inverted the relationship below.\n\nTODO: Check Madingley code for function implementation\n\nArgs:\n    lambda_se: The instantaneous rate of senescence mortality at point of maturity\n                [day^-1].\n    t_to_maturity: The time it took the cohort to reach maturity [days].\n    t_since_maturity: The time elapsed since the cohort reached maturity [days]."
"virtual_ecosystem.models.animal.scaling_functions.starvation_mortality" = "Mortality from body-mass loss.\n\nThere is a error in the madingley paper that does not follow their source code. The\npaper uses exp(k) instead of exp(-k).\n\nArgs:\n    lambda_max: The maximum possible instantaneous fractional starvation mortality\n        rate. [day^-1]\n    J_st: Determines the inflection point of the logistic function describing ratio\n        of the realised mortality rate to the maximum rate. [unitless]\n    zeta_st:The scaling of the logistic function describing the ratio of the\n        realised mortality rate to the maximum rate. [unitless]\n    mass_current: The current mass of the animal cohort [kg].\n    mass_max: The maximum body mass ever achieved by individuals of this type [kg]."
"virtual_ecosystem.models.animal.animal_model.AnimalModel.metamorphose" = "This transforms a larval status cohort into an adult status cohort.\n\nThis method takes an indirect developing cohort in its larval form,\ninflicts a mortality rate, and creates an adult cohort of the correct type.\n\nTODO: Build in a relationship between larval_cohort mass and adult cohort mass.\nTODO: Is adult_mass the correct mass threshold?\nTODO: If the time step drops below a month, this needs an intermediary stage.\n\nArgs:\n    larval_cohort: The cohort in its larval stage to be transformed."
"math.ceil" = "ceil(x: _SupportsFloatOrIndex, /) -> int\n\nReturn the ceiling of x as an Integral.\n\nThis is the smallest integer >= x."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.respire" = "Transfers carbonaceous metabolic wastes to the atmosphere.\n\nThis method processes the metabolic waste for carbon and returns the total\nmass respired to the atmosphere as a float. Currently, only carbon is affected.\n\nArgs:\n    excreta_mass: A dictionary representing the mass of each nutrient excreted\n        by the cohort: {\"C\": value, \"N\": value,\n        \"P\": value}."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.__init__" = ""
"virtual_ecosystem.models.animal.decay.find_decay_consumed_split" = "Find fraction of biomass that is assumed to decay rather than being scavenged.\n\nThis should be calculated separately for each relevant biomass type (excrement and\ncarcasses). This function should could be replaced in future by something that\nincorporates more of the factors determining this split (e.g. temperature).\n\nArgs:\n    microbial_decay_rate: Rate at which biomass type decays due to microbes [day^-1]\n    animal_scavenging_rate: Rate at which biomass type is scavenged due to animals\n        [day^-1]"
"virtual_ecosystem.models.animal.animal_model.AnimalModel.reintegrate_cohort" = "Handles integration of cohorts from migrated/aquatic to active status.\n\nArgs:\n    cohort: The animal cohort changing to active status.\n    source: Whether the cohort was migrated or aquatic."
"virtual_ecosystem.models.animal.animal_model.AnimalModel.create_new_cohort" = "Create a new AnimalCohort and register it in the model.\n\nArgs:\n    functional_group: Functional group defining cohort traits.\n    mass: Body mass (kg) at creation.\n    age: Age (days) at creation.\n    individuals: Number of individuals in the cohort.\n    centroid_key: Grid cell for territorial location.\n    is_birth: Whether the cohort is a new offspring (affects aquatic routing)."
"virtual_ecosystem.models.animal.animal_model.AnimalModel.migrate_external" = "Handles the initiation of external migration events.\n\nArgs:\n    cohort: The migrating cohort."
"virtual_ecosystem.models.animal.animal_cohorts.AnimalCohort.is_migration_season" = "Handles determination of whether it is time to migrate.\n\nTemporary probabilistic migration.\n\nTODO: update when we have seasonality\n\nReturns: A bool of whether it is time to migrate."
"virtual_ecosystem.models.animal.scaling_functions.territory_size" = "Allometric scaling of territory size from body mass.\n\nTODO: Decide whether to use current mass or adult mass.\n\nArgs:\n    mass_kg: Body mass of the animal [kg].\n    terms: A tuple (intercept, exponent) for the log-log scaling relationship,\n        where intercept and exponent act on ln(BM_g)."
"virtual_ecosystem.models.hydrology.hydrology_tools.calculate_effective_saturation" = "Calculate the effective soil saturation based on the soil moisture.\n\nThis is kept as a separate function because the soil model also needs to use this\nquantity.\n\nArgs:\n    soil_moisture: Volumetric relative water content in top soil, [unitless]\n    soil_moisture_saturation: Soil moisture saturation, [unitless]\n    soil_moisture_residual: Residual soil moisture, [unitless]"
"virtual_ecosystem.models.hydrology.hydrology_tools.setup_hydrology_input_current_timestep" = "Select and pre-process inputs for hydrology.update() for current time step.\n\nThe hydrology model currently loops over 30 days per month. Atmospheric variables in\nthe canopy and\nnear the surface are selected here and kept constant for the whole month. Daily\ntimeseries of precipitation and canopy transpiration are generated from monthly\nvalues in `data` to be used in the daily loop. States of other hydrology variables\nare selected and updated in the daily loop.\n\nThe function returns a dictionary with the following variables:\n\n* surface_temperature (TODO switch to subcanopy_temperature)\n* surface_humidity (TODO switch to subcanopy_humidity)\n* surface_pressure (TODO switch to subcanopy_pressure)\n* surface_wind_speed (TODO switch to subcanopy_wind_speed)\n\n* atmospheric_pressure_canopy\n* air_temperature_canopy\n* vapour_pressure_deficit_canopy\n\n* leaf_area_index_sum\n* current_precipitation\n* current_snowfall\n* current_transpiration\n* current_soil_moisture\n* top_soil_moisture_saturation\n* top_soil_moisture_residual\n* groundwater_storage\n* condensation\n\nArgs:\n    data: Data object that contains inputs from the microclimate model, the plant\n        model, and the hydrology model that are required for current update\n    time_index: Time index of current time step\n    days: Number of days in core time step\n    seed: Seed for random rainfall generator\n    layer_structure: The LayerStructure instance for a simulation.\n    soil_layer_thickness_mm: The thickness of the soil layer, [mm]\n    soil_moisture_saturation: Soil moisture saturation, unitless\n    soil_moisture_residual: Soil moisture residual, unitless\n    p_wet_wet: Probability a wet day follows a wet day.\n    p_wet_dry: Probability a wet day follows a dry day.\n    temperature_threshold_snow: Temperature below which all precipitation falls as\n        snow, [°C]\n    temperature_threshold_rain: Temperature above which all precipitation falls as\n        rain, [°C]\n    shape_parameter: Shape parameter of the Gamma distribution controlling\n        rainfall variability.\n    scale_parameter: Scale parameter of the Gamma distribution controlling\n        absolute magnitude of rainfall."
"virtual_ecosystem.models.hydrology.below_ground.update_soil_moisture" = "Update soil moisture profile with mass-conserving flux limitation.\n\nThis function calculates soil moisture for each layer by removing the vertical flow\nof the current layer and adding it to the layer below. Additionally, canopy\ntranspiration and subsurface stormflow are removed from the second soil layer.\nIf the requested outgoing fluxes exceed the water available above residual soil\nmoisture, only the removable fluxes are reduced so that mass is conserved and soil\nmoisture does not fall below the residual value because of flux removal.\nTranspiration is treated as an external demand and is not modified here.\n\nArgs:\n    soil_moisture: Soil moisture after infiltration and surface evaporation, [mm]\n    vertical_flow: Potential vertical flow between all layers, [mm]\n    transpiration: Canopy transpiration, [mm]\n    subsurface_stormflow: Potential subsurface storm flow, [mm]\n    soil_moisture_saturation: Soil moisture saturation for each layer, [mm]\n    soil_moisture_residual: Residual soil moisture for each layer, [mm]"
"numpy.minimum" = ""
"virtual_ecosystem.models.hydrology.above_ground.calculate_interception" = "Estimate canopy interception.\n\nThis function estimates canopy interception using the following storage-based\nequation after :cite:t:`aston_rainfall_1979` and :cite:t:`merriam_note_1960` as\nimplemented in :cite:t:`van_der_knijff_lisflood_2010` :\n\n.. math :: Int = S_{max} [1 - e^{\\frac{-k R \\Delta t}{S_{max}}}]\n\nwhere :math:`Int` [mm] is the interception per time step, :math:`S_{max}` [mm] is\nthe maximum interception, :math:`R` is the rainfall intensity per time step [mm] and\nthe factor :math:`k` accounts for the density of the vegetation.\n\n:math:`S_{max}` is calculated using an empirical equation\n:cite:p:`von_hoyningen-huene_interzeption_1981`:\n\n  .. math::\n    :nowrap:\n\n    \\[\n        S_{max} =\n            \\begin{cases}\n                0.935 + 0.498 \\cdot \\text{LAI} - 0.00575 \\cdot \\text{LAI}^{2},\n                  & \\text{LAI} > 0.1 \\\\\n                0, &  \\text{LAI} \\le 0.1,\n            \\end{cases}\n    \\]\n\nwhere LAI is the average Leaf area index [m1 m-1]. :math:`k` is estimated as:\n\n:math:`k=0.046 \\cdot LAI`\n\nArgs:\n    leaf_area_index: Leaf area index for all canopy layers, [m m-1]\n    precipitation: Precipitation, [mm]\n    intercept_parameters: Parameters for equation estimating maximum canopy\n        interception capacity.\n    veg_density_param: Parameter used to estimate vegetation density for maximum\n        canopy interception capacity estimate"
"virtual_ecosystem.models.hydrology.above_ground.calculate_bypass_flow" = "Calculate preferential bypass flow.\n\nBypass flow is here defined as the flow that bypasses the soil matrix and drains\ndirectly to the groundwater. During each time step, a fraction of the water that is\navailable for infiltration is added to the groundwater directly (i.e. without first\nentering the soil matrix). It is assumed that this fraction is a power function of\nthe relative saturation of the superficial and upper soil layers. This results in\nthe following equation (after :cite:t:`van_der_knijff_lisflood_2010`):\n\n.. math :: D_{pref, gw} = W_{av} (\\frac{w_{1}}{w_{s1}})^{c_{pref}}\n\nwhere :math:`D_{pref, gw}` is the amount of preferential flow per time step [mm],\n:math:`W_{av}` is the amount of water that is available for infiltration, and\n:math:`c_{pref}` is an empirical shape parameter. This parameter affects how much of\nthe water available for infiltration goes directly to groundwater via preferential\nbypass flow; a value of 0 means all surface water goes directly to groundwater, a\nvalue of 1 gives a linear relation between soil moisture and bypass flow.\nThe equation returns a preferential flow component that becomes increasingly\nimportant as the soil gets wetter.\n\nArgs:\n    top_soil_moisture: Soil moisture of top soil layer, [mm]\n    sat_top_soil_moisture: Soil moisture of top soil layer at saturation, [mm]\n    available_water: Amount of water available for infiltration, [mm]\n    bypass_flow_coefficient: Bypass flow coefficient, dimensionless"
"virtual_ecosystem.models.hydrology.below_ground.update_groundwater_storage" = "Update groundwater storage and calculate below ground horizontal flow.\n\nGroundwater storage and transport are modelled using two parallel linear reservoirs,\nsimilar to the approach used in the HBV-96 model\n:cite:p:`lindstrom_development_1997` and the LISFLOOD\n:cite:p:`van_der_knijff_lisflood_2010`.\n\nThe upper zone represents a quick runoff component, which includes fast groundwater\nand subsurface flow through macro-pores in the soil. The lower zone represents the\nslow groundwater component that generates the base flow.\n\nThe outflow from the upper zone to the channel, :math:`Q_{uz}`, [mm], equals:\n\n:math:`Q_{uz} = \\frac{1}{T_{uz}} * UZ`\n\nwhere :math:`T_{uz}` is the reservoir constant for the upper groundwater layer\n[days], and :math:`UZ` is the amount of water that is stored in the upper zone [mm].\nThe amount of water stored in the upper zone is computed as follows:\n\n:math:`UZ = GW_{uz} + D_{ls,gw} + D_{pref,gw} - D_{uz,lz}`\n\nwhere :math:`GW_{uz}` is the amount of water stored in the upper groundwater zone\nat the start of the timestep, :math:`D_{ls,gw}` is the flow from the lower soil\nlayer to groundwater, :math:`D_{pref,gw}` is the amount of preferential flow or\nbypass flow per time step, and :math:`D_{uz,lz}` is the amount of water that\npercolates from the upper to the lower zone, all in [mm].\n\nThe water that percolates from the upper to the lower zone is the inflow to the\nlower groundwater zone. This amount of water is provided by the upper groundwater\nzone. :math:`D_{uz,lz}` is a fixed amount per computational time step and it is\ndefined as follows:\n\n:math:`D_{uz,lz} = \\min(GW_{perc}, UZ)`\n\nwhere :math:`GW_{perc}`, [mm], is the maximum percolation rate from the upper to\nthe lower groundwater zone for the timestep. The outflow from the lower zone to the\nchannel is then computed by:\n\n:math:`Q_{lz} = \\frac{1}{T_{lz}} * LZ`\n\n:math:`T_{lz}` is the reservoir constant for the lower groundwater layer, [days],\nand :math:`LZ` is the amount of water that is stored in the lower zone, [mm].\n:math:`LZ` is computed as follows:\n\n:math:`LZ = GW_{lz} + D_{uz,lz} - GW_{loss,act}`\n\nwhere :math:`GW_{lz}` is the amount of water stored in the lower groundwater zone\nat the start of the timestep, :math:`D_{uz,lz}` is the percolation from the upper\ngroundwater zone, [mm], and :math:`GW_{loss,act}` is the actual groundwater loss,\n[mm], defined as:\n\n:math:`GW_{loss,act} = \\min(GW_{loss}, GW_{lz} + D_{uz,lz})`\n\nThe amount of water defined by :math:`GW_{loss}` never rejoins the river channel and\nis lost beyond the catchment boundaries or to deep groundwater systems. The larger\nthe value of :math:`GW_{loss}`, the larger the amount of water that leaves the\nsystem. The actual groundwater loss is capped by the water available in the lower\nzone so that groundwater storage cannot become negative.\n\nArgs:\n    groundwater_storage: Amount of water that is stored in the groundwater reservoir\n        , [mm]\n    vertical_flow_to_groundwater: Flow from the lower soil layer to groundwater for\n        this timestep, [mm]\n    bypass_flow: Flow that bypasses the soil matrix and drains directly to the\n        groundwater, [mm]\n    max_percolation_rate_uzlz: Maximum percolation rate between upper and lower\n        groundwater zone for this timestep, [mm]\n    groundwater_loss: Potential amount of water that never rejoins the river channel\n        and is lost beyond the catchment boundaries or to deep groundwater systems\n        for this timestep, [mm]\n    reservoir_const_upper_groundwater: Reservoir constant for the upper groundwater\n        layer, [days]\n    reservoir_const_lower_groundwater: Reservoir constant for the lower groundwater\n        layer, [days]"
"xarray.core.dataarray.DataArray" = "DataArray(data: Any=dtypes.NA, coords: (\n            Sequence[Sequence | pd.Index | DataArray | Variable | np.ndarray]\n            | Mapping\n            | None\n        )=None, dims: str | Iterable[Hashable] | None=None, name: Hashable | None=None, attrs: Mapping | None=None, indexes: Mapping[Hashable, Index] | None=None, fastpath: bool=False)\n\nN-dimensional array with labeled coordinates and dimensions.\n\nDataArray provides a wrapper around numpy ndarrays that uses\nlabeled dimensions and coordinates to support metadata aware\noperations. The API is similar to that for the pandas Series or\nDataFrame, but DataArray objects can have any number of dimensions,\nand their contents have fixed data types.\n\nAdditional features over raw numpy arrays:\n\n- Apply operations over dimensions by name: ``x.sum('time')``.\n- Select or assign values by integer location (like numpy):\n  ``x[:10]`` or by label (like pandas): ``x.loc['2014-01-01']`` or\n  ``x.sel(time='2014-01-01')``.\n- Mathematical operations (e.g., ``x - y``) vectorize across\n  multiple dimensions (known in numpy as \"broadcasting\") based on\n  dimension names, regardless of their original order.\n- Keep track of arbitrary metadata in the form of a Python\n  dictionary: ``x.attrs``\n- Convert to a pandas Series: ``x.to_series()``.\n\nGetting items from or doing mathematical operations with a\nDataArray always returns another DataArray.\n\nParameters\n----------\ndata : array_like\n    Values for this array. Must be an ``numpy.ndarray``, ndarray\n    like, or castable to an ``ndarray``. If a self-described xarray\n    or pandas object, attempts are made to use this array's\n    metadata to fill in other unspecified arguments. A view of the\n    array's data is used instead of a copy if possible.\ncoords : sequence or dict of array_like or :py:class:`~xarray.Coordinates`, optional\n    Coordinates (tick labels) to use for indexing along each\n    dimension. The following notations are accepted:\n\n    - mapping {dimension name: array-like}\n    - sequence of tuples that are valid arguments for\n      ``xarray.Variable()``\n      - (dims, data)\n      - (dims, data, attrs)\n      - (dims, data, attrs, encoding)\n\n    Additionally, it is possible to define a coord whose name\n    does not match the dimension name, or a coord based on multiple\n    dimensions, with one of the following notations:\n\n    - mapping {coord name: DataArray}\n    - mapping {coord name: Variable}\n    - mapping {coord name: (dimension name, array-like)}\n    - mapping {coord name: (tuple of dimension names, array-like)}\n\n    Alternatively, a :py:class:`~xarray.Coordinates` object may be used in\n    order to explicitly pass indexes (e.g., a multi-index or any custom\n    Xarray index) or to bypass the creation of a default index for any\n    :term:`Dimension coordinate` included in that object.\ndims : Hashable or sequence of Hashable, optional\n    Name(s) of the data dimension(s). Must be either a Hashable\n    (only for 1D data) or a sequence of Hashables with length equal\n    to the number of dimensions. If this argument is omitted,\n    dimension names are taken from ``coords`` (if possible) and\n    otherwise default to ``['dim_0', ... 'dim_n']``.\nname : str or None, optional\n    Name of this array.\nattrs : dict_like or None, optional\n    Attributes to assign to the new instance. By default, an empty\n    attribute dictionary is initialized.\n    (see FAQ, :ref:`approach-to-metadata`)\nindexes : :py:class:`~xarray.Indexes` or dict-like, optional\n    For internal use only. For passing indexes objects to the\n    new DataArray, use the ``coords`` argument instead with a\n    :py:class:`~xarray.Coordinate` object (both coordinate variables\n    and indexes will be extracted from the latter).\n\nExamples\n--------\nCreate data:\n\n>>> np.random.seed(0)\n>>> temperature = 15 + 8 * np.random.randn(2, 2, 3)\n>>> lon = [[-99.83, -99.32], [-99.79, -99.23]]\n>>> lat = [[42.25, 42.21], [42.63, 42.59]]\n>>> time = pd.date_range(\"2014-09-06\", periods=3)\n>>> reference_time = pd.Timestamp(\"2014-09-05\")\n\nInitialize a dataarray with multiple dimensions:\n\n>>> da = xr.DataArray(\n...     data=temperature,\n...     dims=[\"x\", \"y\", \"time\"],\n...     coords=dict(\n...         lon=([\"x\", \"y\"], lon),\n...         lat=([\"x\", \"y\"], lat),\n...         time=time,\n...         reference_time=reference_time,\n...     ),\n...     attrs=dict(\n...         description=\"Ambient temperature.\",\n...         units=\"degC\",\n...     ),\n... )\n>>> da\n<xarray.DataArray (x: 2, y: 2, time: 3)> Size: 96B\narray([[[29.11241877, 18.20125767, 22.82990387],\n        [32.92714559, 29.94046392,  7.18177696]],\n<BLANKLINE>\n       [[22.60070734, 13.78914233, 14.17424919],\n        [18.28478802, 16.15234857, 26.63418806]]])\nCoordinates:\n    lon             (x, y) float64 32B -99.83 -99.32 -99.79 -99.23\n    lat             (x, y) float64 32B 42.25 42.21 42.63 42.59\n  * time            (time) datetime64[us] 24B 2014-09-06 2014-09-07 2014-09-08\n    reference_time  datetime64[us] 8B 2014-09-05\nDimensions without coordinates: x, y\nAttributes:\n    description:  Ambient temperature.\n    units:        degC\n\nFind out where the coldest temperature was:\n\n>>> da.isel(da.argmin(...))\n<xarray.DataArray ()> Size: 8B\narray(7.18177696)\nCoordinates:\n    lon             float64 8B -99.32\n    lat             float64 8B 42.21\n    time            datetime64[us] 8B 2014-09-08\n    reference_time  datetime64[us] 8B 2014-09-05\nAttributes:\n    description:  Ambient temperature.\n    units:        degC"
"virtual_ecosystem.models.hydrology.below_ground.calculate_subsurface_stormflow" = "Calculate lateral subsurface stormflow (Q2).\n\nThe lateral subsurface flow implementation is based on after\n:cite:t:`ye_regionalization_2014`:\n\n:math:`Q_2 = k_{Q_2} \\, S_e^{\\beta_{Q_2}} \\, \\max(q_{\\mathrm{root}} - T, 0)`\n\nwhere :math:`Q_2` is the lateral subsurface stormflow (mm timestep-1),\n:math:`k_{Q_2}`\nis the empirical lateral flow coefficient, :math:`S_e` is the effective saturation\nof the middle soil layer (-), :math:`beta_{Q_2}` is a non-linearity exponent,\n:math:`S2` is the middle soil water storage (mm), :math:`q_{root}` is the root-zone\nsoil moisture (mm), and :math:`T` is the transpiration\nextracted from the middle soil layer during the current timestep (mm).\n\nArgs:\n    effective_saturation: Effective saturation of root soil layer, [-]\n    root_soil_moisture: Root-zone soil moisture, [mm]\n    transpiration: Transpiration, equivalent to root water uptake, [mm]\n    stormflow_coefficient: Stormflow coefficient, [-]\n    saturation_exponent: Saturation exponent, [-]"
"virtual_ecosystem.models.hydrology.above_ground.calculate_temperature_driven_snowmelt" = "Calculate temperature-driven snowmelt, [mm].\n\nMelt is calculated from the energy available to warm the snowpack to\n:math:`0\\,^{\\circ}\\mathrm{C}`, expressed as a fraction of the latent heat\nrequired for phase change:\n\n.. math::\n\n    M = \\min \\left(S,\\, \\frac{c_{\\mathrm{ice}}\\,\\max(T_{s}, 0)}{L_{f}} S \\right)\n\nwhere :math:`c_{\\mathrm{ice}}` (:math:`\\mathrm{J\\,kg^{-1}\\,K^{-1}}`) is the\nheat capacity of ice, :math:`L_{f}` (:math:`\\mathrm{J\\,kg^{-1}}`) is the latent\nheat of fusion of ice, and :math:`S` is the snow water equivalent. The\n:math:`\\min` operator ensures that melt cannot exceed the available snow water\nequivalent.\n\nArgs:\n    snow_water_equivalent: Snow water equivalent, [mm]\n    surface_temperature: Surface temperature, [°C]\n    heat_capacity_ice: Specific heat capacity of ice, [J kg-1 K-1]\n    latent_heat_fusion: Latent heat of fusion of ice, [J kg-1]"
"virtual_ecosystem.models.hydrology.above_ground.calculate_rain_driven_snowmelt" = "Calculate snowmelt generated by rainfall, [mm].\n\nSnowmelt due to rainfall is calculated as:\n\n.. math::\n\n    M_{r} = k_{r} T_{a} P_{r}\n\nwhere :math:`k_{r}` (:cite:p:`kearney_how_2020`) is the rainfall melt coefficient,\n:math:`T_{a}` is the air temperature, and :math:`P_{r}` is the rainfall rate.\nMelt is set to zero when air temperature is at or below freezing.\n\nArgs:\n    air_temperature: Air temperature, [°C]\n    rainfall: Rainfall, [mm]\n    rain_driven_snowmelt_coefficient: Rainfall melt coefficient :math:`k_{r}`,\n        [mm mm-1 K-1]"
"virtual_ecosystem.models.hydrology.above_ground.calculate_snow_sublimation" = "Calculate snow sublimation, [mm].\n\nSnow sublimation is approximated as:\n\n.. math::\n\n    S = k_{s} T_{c} \\mathrm{SWE}\n\nwhere :math:`k_{s}` is an empirical sublimation coefficient,\n:math:`T_{c} = \\max(-T_{a}, 0)` is the temperature below freezing,\n:math:`T_{a}` is the air temperature, and :math:`\\mathrm{SWE}` is the\nsnow water equivalent. Sublimation is set to zero when air temperature\nis above freezing and capped so that it cannot exceed the available\nsnow water equivalent.\n\nThe function is inspired by the rain driven snowmelt function, but with the\ntemperature below freezing instead of above. We only consider positive flow towards\nthe atmosphere, no deposition.\n\nArgs:\n    air_temperature: Air temperature, [°C]\n    snow_water_equivalent: Snow water equivalent, [mm]\n    sublimation_coefficient: Sublimation coefficient :math:`k_{s}`,\n        [K-1 timestep-1]"
"numpy._core.fromnumeric.any" = "any(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike, axis: tuple[int, ...], out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool] | Any\nany(a: np.ndarray[ShapeT], axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[np.bool]]\nany(a: ArrayLike, axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike | None, axis: int | tuple[int, ...] | None=None, *, out: ArrayT, keepdims: bool | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> ArrayT\nany(a: ArrayLike | None, axis: int | tuple[int, ...] | None, out: ArrayT, keepdims: bool | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> ArrayT\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\nany(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike, axis: tuple[int, ...], out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool] | Any\nany(a: np.ndarray[ShapeT], axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[np.bool]]\nany(a: ArrayLike, axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike | None, axis: int | tuple[int, ...] | None=None, *, out: ArrayT, keepdims: bool | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> ArrayT\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\nany(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike, axis: tuple[int, ...], out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool] | Any\nany(a: np.ndarray[ShapeT], axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[np.bool]]\nany(a: ArrayLike, axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\nany(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike, axis: tuple[int, ...], out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool] | Any\nany(a: np.ndarray[ShapeT], axis: int | tuple[int, ...] | None=None, out: None=None, *, keepdims: Literal[True], where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[np.bool]]\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\nany(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike, axis: tuple[int, ...], out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool] | Any\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\nany(a: ArrayLike, axis: int, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.bool]\nany(a: ArrayLike | None, axis: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., *, where: _ArrayLikeBool_co | _NoValueType=...) -> np.bool\n\nTest whether any array element along a given axis evaluates to True.\n\nReturns single boolean if `axis` is ``None``\n\nParameters\n----------\na : array_like\n    Input array or object that can be converted to an array.\naxis : None or int or tuple of ints, optional\n    Axis or axes along which a logical OR reduction is performed.\n    The default (``axis=None``) is to perform a logical OR over all\n    the dimensions of the input array. `axis` may be negative, in\n    which case it counts from the last to the first axis. If this\n    is a tuple of ints, a reduction is performed on multiple\n    axes, instead of a single axis or all the axes as before.\nout : ndarray, optional\n    Alternate output array in which to place the result.  It must have\n    the same shape as the expected output and its type is preserved\n    (e.g., if it is of type float, then it will remain so, returning\n    1.0 for True and 0.0 for False, regardless of the type of `a`).\n    See :ref:`ufuncs-output-type` for more details.\n\nkeepdims : bool, optional\n    If this is set to True, the axes which are reduced are left\n    in the result as dimensions with size one. With this option,\n    the result will broadcast correctly against the input array.\n\n    If the default value is passed, then `keepdims` will not be\n    passed through to the `any` method of sub-classes of\n    `ndarray`, however any non-default value will be.  If the\n    sub-class' method does not implement `keepdims` any\n    exceptions will be raised.\n\nwhere : array_like of bool, optional\n    Elements to include in checking for any `True` values.\n    See `~numpy.ufunc.reduce` for details.\n\n    .. versionadded:: 1.20.0\n\nReturns\n-------\nany : bool or ndarray\n    A new boolean or `ndarray` is returned unless `out` is specified,\n    in which case a reference to `out` is returned.\n\nSee Also\n--------\nndarray.any : equivalent method\n\nall : Test whether all elements along a given axis evaluate to True.\n\nNotes\n-----\nNot a Number (NaN), positive infinity and negative infinity evaluate\nto `True` because these are not equal to zero.\n\n.. versionchanged:: 2.0\n   Before NumPy 2.0, ``any`` did not return booleans for object dtype\n   input arrays.\n   This behavior is still available via ``np.logical_or.reduce``.\n\nExamples\n--------\n>>> import numpy as np\n>>> np.any([[True, False], [True, True]])\nTrue\n\n>>> np.any([[True,  False, True ],\n...         [False, False, False]], axis=0)\narray([ True, False, True])\n\n>>> np.any([-1, 0, 5])\nTrue\n\n>>> np.any([[np.nan], [np.inf]], axis=1, keepdims=True)\narray([[ True],\n       [ True]])\n\n>>> np.any([[True, False], [False, False]], where=[[False], [True]])\nFalse\n\n>>> a = np.array([[1, 0, 0],\n...               [0, 0, 1],\n...               [0, 0, 0]])\n>>> np.any(a, axis=0)\narray([ True, False,  True])\n>>> np.any(a, axis=1)\narray([ True,  True, False])\n\n>>> o=np.array(False)\n>>> z=np.any([-1, 4, 5], out=o)\n>>> z, o\n(array(True), array(True))\n>>> # Check now that z is a reference to o\n>>> z is o\nTrue\n>>> id(z), id(o) # identity of z and o              # doctest: +SKIP\n(191614240, 191614240)"
"virtual_ecosystem.models.hydrology.hydrology_tools.check_water_balance" = "Check closure of the liquid-water balance over a day or model interval.\n\nThe balance includes rainfall and condensation as inputs; canopy evaporation,\nsoil evaporation, transpiration, groundwater loss and runoff at catchment outlets\nas outputs; and soil moisture plus groundwater as storage. Snowfall, snow storage,\nsublimation and snowmelt are deliberately excluded.\n\nGrid-cell water depths are summed directly, which is valid for the square,\nequal-area grid used by the hydrology model.\n\nArgs:\n    drainage_map: Mapping from each cell ID to all upstream cell IDs.\n    routed_runoff_mm: Routed runoff at every cell, [mm].\n    precipitation_mm: Liquid precipitation entering the canopy, [mm].\n    condensation_mm: Condensation added to the land surface, [mm].\n    canopy_evaporation_mm: Canopy evaporation, [mm].\n    soil_evaporation_mm: Soil evaporation, [mm].\n    transpiration_mm: Plant transpiration, [mm].\n    groundwater_loss_mm: Water lost from groundwater, [mm].\n    storage_start_mm: Soil and groundwater storage at period start, [mm].\n    storage_end_mm: Soil and groundwater storage at period end, [mm].\n    relative_tolerance: Relative tolerance for the closure check.\n    absolute_tolerance: Absolute tolerance for the closure check, [mm].\n    period: Label used in any error message, e.g. ``\"day 1\"`` or\n        ``\"update interval\"``."
"virtual_ecosystem.models.litter.env_factors.calculate_environmental_factors" = "Calculate the impact of the environment has on litter decay across litter layers.\n\nFor the above ground layer the impact of temperature is calculated, and for the\nbelow ground layer the effect of temperature and soil water potential are both\ncalculated.\n\nThe relevant above ground temperature is the surface temperature, which can be\neasily extracted from the temperature data. It's more complex for the below ground\ntemperature and the water potential as the relevant values are averages across the\nmicrobially active depth. These are calculated by averaging across the soil layers\nwith each layer weighted by the proportion of the total microbially active depth it\nrepresents.\n\nIf a shallow microbially active depth is used then below ground litter decomposition\nwill be exposed to a high degree of environmental variability. This is\nrepresentative of the real world, but needs to be kept in mind when comparing to\nother models.\n\nArgs:\n    air_temperatures: Air temperatures, for all above ground layers [Celsius]\n    soil_temperatures: Soil temperatures, for all soil layers [Celsius]\n    water_potentials: Water potentials, for all soil layers [kPa]\n    layer_structure: The LayerStructure instance for the simulation.\n    constants: Set of constants for the litter model"
"virtual_ecosystem.models.litter.env_factors.calculate_temperature_effect_on_litter_decomp" = "Calculate the effect that temperature has on litter decomposition rates.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature: The temperature of the litter layer [Celsius]\n    reference_temp: The reference temperature for changes in litter decomposition\n        rates with temperature [Celsius]\n    offset_temp: Temperature offset [Celsius]\n    temp_response: Factor controlling response strength to changing temperature\n        [unitless]"
"virtual_ecosystem.models.soil.env_factors.calculate_water_potential_impact_on_microbes" = "Calculate the effect that soil water potential has on microbial rates.\n\nThis function produces values of one (i.e. no suppression due to soil water) when\nsoil water potentials that are greater than the optimal water potential. Below the\nwater potential at which microbial activity ceases suppression is (by definition)\ntotal, so values of zero are produced.\n\nThe microbial rates effected by the function can be explicit rates (used in the soil\nmodel), or implicit rates (i.e. the decay rates of below ground litter pools). In\nboth cases the same functional response is used (which is taken from\n:cite:t:`moyano_responses_2013`).\n\nArgs:\n    water_potential: Soil water potential [kPa]\n    water_potential_halt: Water potential at which all microbial activity stops\n        [kPa]\n    water_potential_opt: Optimal water potential for microbial activity [kPa]\n    response_curvature: Parameter controlling the curvature of function that\n        captures the response of microbial rates to water potential [unitless]"
"virtual_ecosystem.models.litter.carbon.calculate_decay_rates" = "Calculate the decay rate for all five of the litter pools.\n\nArgs:\n    lignin_above_structural: Proportion of above ground structural pool which is\n        lignin [kg{lignin C} kg{C}^-1]\n    lignin_woody: Proportion of dead wood pool which is lignin\n        [kg{lignin C} kg{C}^-1]\n    lignin_below_structural: Proportion of below ground structural pool which is\n        lignin [kg{lignin C} kg{C}^-1]\n    air_temperatures: Air temperatures, for all above ground layers [Celsius]\n    soil_temperatures: Soil temperatures, for all soil layers [Celsius]\n    water_potentials: Water potentials, for all soil layers [kPa]\n    layer_structure: The LayerStructure instance for the simulation.\n    constants: Set of constants for the litter model\n\nDecay rates depend on lignin proportions as well as a range of environmental\nfactors. These environmental factors are calculated as part of this function."
"virtual_ecosystem.models.litter.carbon.calculate_litter_decay_metabolic_above" = "Calculate decay of above ground metabolic litter pool.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature_factor: A multiplicative factor capturing the impact of temperature\n        on litter decomposition [unitless]\n    litter_decay_coefficient: The decay coefficient for the above ground metabolic\n        litter pool [day^-1]"
"virtual_ecosystem.models.litter.carbon.calculate_litter_decay_structural_above" = "Calculate decay of above ground structural litter pool.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature_factor: A multiplicative factor capturing the impact of temperature\n        on litter decomposition [unitless]\n    lignin_proportion: The proportion of the above ground structural pool which is\n        lignin [kg{lignin C} kg{C}^-1]\n    litter_decay_coefficient: The decay coefficient for the above ground structural\n        litter pool [day^-1]\n    lignin_inhibition_factor: An exponential factor expressing the extent to which\n        lignin inhibits the breakdown of litter [unitless]"
"virtual_ecosystem.models.litter.carbon.calculate_litter_decay_woody" = "Calculate decay of the woody litter pool.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature_factor: A multiplicative factor capturing the impact of temperature\n        on litter decomposition [unitless]\n    lignin_proportion: The proportion of the woody litter pool which is lignin\n        [kg{lignin C} kg{C}^-1]\n    litter_decay_coefficient: The decay coefficient for the woody litter pool\n        [day^-1]\n    lignin_inhibition_factor: An exponential factor expressing the extent to which\n        lignin inhibits the breakdown of litter [unitless]"
"virtual_ecosystem.models.litter.carbon.calculate_litter_decay_metabolic_below" = "Calculate decay of below ground metabolic litter pool.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature_factor: A multiplicative factor capturing the impact of temperature\n        on litter decomposition [unitless]\n    moisture_factor: A multiplicative factor capturing the impact of soil moisture\n        on litter decomposition [unitless]\n    litter_decay_coefficient: The decay coefficient for the below ground metabolic\n        litter pool [day^-1]"
"virtual_ecosystem.models.litter.carbon.calculate_litter_decay_structural_below" = "Calculate decay of below ground structural litter pool.\n\nThis function is taken from :cite:t:`kirschbaum_modelling_2002`.\n\nArgs:\n    temperature_factor: A multiplicative factor capturing the impact of temperature\n        on litter decomposition [unitless]\n    moisture_factor: A multiplicative factor capturing the impact of soil moisture\n        on litter decomposition [unitless]\n    lignin_proportion: The proportion of the below ground structural pool which is\n        lignin [kg{lignin C} kg{C}^-1]\n    litter_decay_coefficient: The decay coefficient for the below ground structural\n        litter pool [day^-1]\n    lignin_inhibition_factor: An exponential factor expressing the extent to which\n        lignin inhibits the breakdown of litter [unitless]"
"virtual_ecosystem.models.litter.carbon.calculate_carbon_mineralised_vs_respired" = "Calculate amount of litter carbon loss that gets mineralised vs respired.\n\nArgs:\n    carbon_loss: Total amount of carbon lost from the litter pool [kg{C} m-2]\n    carbon_use_efficiency: Carbon use efficiency of litter pool [unitless]"
"virtual_ecosystem.models.litter.inputs.calculate_metabolic_proportions_of_input" = "Calculate the proportion of each input type that flows to the metabolic pool.\n\nThis function is used for roots, leaves, subcanopy vegetation and seedbank\nbiomasses, and above- and below-ground herbivory waste, but not for deadwood because\nall deadwood goes into a single woody litter pool.\n\nArgs:\n    total_input: The total amount of carbon in each input pools [kg{C} m^-3], as\n        well as the nitrogen content [kg{N} m^-3], phosphorus content [kg{P} m^-3]\n        and lignin proportions [kg{lignin C} kg{C}^-1] of each of these pools.\n    constants: Set of constants for the litter model."
"virtual_ecosystem.models.litter.inputs.split_pool_into_metabolic_and_structural_litter" = "Calculate the split of input biomass between metabolic and structural pools.\n\nThis division depends on the lignin, nitrogen and phosphorus contents of the input\nbiomass, the functional form is taken from :cite:t:`parton_dynamics_1988`.\n\nArgs:\n    input_masses: Mass of each nutrient in the input biomass [kg{C} m^-2]\n    lignin_proportion: Proportion of input biomass carbon that is lignin\n        [kg{lignin C} kg{C}^-1]\n    max_metabolic_fraction: Fraction of pool that becomes metabolic litter for the\n        easiest to breakdown case, i.e. no lignin, ample nitrogen [unitless]\n    split_sensitivity_nitrogen: Sets how rapidly the split changes in response to\n        changing lignin and nitrogen contents [unitless]\n    split_sensitivity_phosphorus: Sets how rapidly the split changes in response to\n        changing lignin and phosphorus contents [unitless]"
"virtual_ecosystem.models.litter.inputs.calculate_input_chemistries" = "Calculate the chemistries of the input to each litter pool.\n\nArgs:\n    litter_inputs: An LitterInputs instance containing the total input of each\n        plant biomass type, the proportion of the input that goes to the relevant\n        metabolic pool for each input type (expect deadwood) and the total input\n        into each litter pool.\n    meta_to_struct_nitrogen_ratio: Ratio of nitrogen concentrations for inputs to\n        the metabolic and structural litter pools [unitless]\n    meta_to_struct_phosphorus_ratio: Ratio of phosphorus concentrations for inputs\n        to the metabolic and structural litter pools [unitless]"
"virtual_ecosystem.models.palms.functional_types.get_flora_from_config" = "Generate a Flora object from a Virtual Ecosystem palms configuration.\n\nArgs:\n    config: A validated PalmsConfiguration instance."
"pyrealm.demography.flora.load_flora_from_csv" = "Create a Flora object from a CSV file.\n\nArgs:\n    path: A path to a CSV file of plant functional type definitions.\n    strict: Require that all traits are specified in the input file.\n    validator: A pydantic class used to validate the data."
"builtins.open" = "open(file: FileDescriptorOrPath, mode: OpenBinaryMode, buffering: Literal[0], encoding: None=None, errors: None=None, newline: None=None, closefd: bool=True, opener: _Opener | None=None) -> FileIO\nopen(file: FileDescriptorOrPath, mode: OpenBinaryModeUpdating, buffering: Literal[-1, 1]=-1, encoding: None=None, errors: None=None, newline: None=None, closefd: bool=True, opener: _Opener | None=None) -> BufferedRandom\nopen(file: FileDescriptorOrPath, mode: OpenBinaryModeWriting, buffering: Literal[-1, 1]=-1, encoding: None=None, errors: None=None, newline: None=None, closefd: bool=True, opener: _Opener | None=None) -> BufferedWriter\nopen(file: FileDescriptorOrPath, mode: OpenBinaryModeReading, buffering: Literal[-1, 1]=-1, encoding: None=None, errors: None=None, newline: None=None, closefd: bool=True, opener: _Opener | None=None) -> BufferedReader\nopen(file: FileDescriptorOrPath, mode: OpenBinaryMode, buffering: int=-1, encoding: None=None, errors: None=None, newline: None=None, closefd: bool=True, opener: _Opener | None=None) -> BinaryIO\nopen(file: FileDescriptorOrPath, mode: str, buffering: int=-1, encoding: str | None=None, errors: str | None=None, newline: str | None=None, closefd: bool=True, opener: _Opener | None=None) -> IO[Any]\n\nOpen file and return a stream.  Raise OSError upon failure.\n\nfile is either a text or byte string giving the name (and the path\nif the file isn't in the current working directory) of the file to\nbe opened or an integer file descriptor of the file to be\nwrapped. (If a file descriptor is given, it is closed when the\nreturned I/O object is closed, unless closefd is set to False.)\n\nmode is an optional string that specifies the mode in which the file\nis opened. It defaults to 'r' which means open for reading in text\nmode.  Other common values are 'w' for writing (truncating the file if\nit already exists), 'x' for creating and writing to a new file, and\n'a' for appending (which on some Unix systems, means that all writes\nappend to the end of the file regardless of the current seek position).\nIn text mode, if encoding is not specified the encoding used is platform\ndependent: locale.getencoding() is called to get the current locale encoding.\n(For reading and writing raw bytes use binary mode and leave encoding\nunspecified.) The available modes are:\n\n========= ===============================================================\nCharacter Meaning\n--------- ---------------------------------------------------------------\n'r'       open for reading (default)\n'w'       open for writing, truncating the file first\n'x'       create a new file and open it for writing\n'a'       open for writing, appending to the end of the file if it exists\n'b'       binary mode\n't'       text mode (default)\n'+'       open a disk file for updating (reading and writing)\n========= ===============================================================\n\nThe default mode is 'rt' (open for reading text). For binary random\naccess, the mode 'w+b' opens and truncates the file to 0 bytes, while\n'r+b' opens the file without truncation. The 'x' mode implies 'w' and\nraises an `FileExistsError` if the file already exists.\n\nPython distinguishes between files opened in binary and text modes,\neven when the underlying operating system doesn't. Files opened in\nbinary mode (appending 'b' to the mode argument) return contents as\nbytes objects without any decoding. In text mode (the default, or when\n't' is appended to the mode argument), the contents of the file are\nreturned as strings, the bytes having been first decoded using a\nplatform-dependent encoding or using the specified encoding if given.\n\nbuffering is an optional integer used to set the buffering policy.\nPass 0 to switch buffering off (only allowed in binary mode), 1 to select\nline buffering (only usable in text mode), and an integer > 1 to indicate\nthe size of a fixed-size chunk buffer.  When no buffering argument is\ngiven, the default buffering policy works as follows:\n\n* Binary files are buffered in fixed-size chunks; the size of the buffer\n is max(min(blocksize, 8 MiB), DEFAULT_BUFFER_SIZE)\n when the device block size is available.\n On most systems, the buffer will typically be 128 kilobytes long.\n\n* \"Interactive\" text files (files for which isatty() returns True)\n  use line buffering.  Other text files use the policy described above\n  for binary files.\n\nencoding is the name of the encoding used to decode or encode the\nfile. This should only be used in text mode. The default encoding is\nplatform dependent, but any encoding supported by Python can be\npassed.  See the codecs module for the list of supported encodings.\n\nerrors is an optional string that specifies how encoding errors are to\nbe handled---this argument should not be used in binary mode. Pass\n'strict' to raise a ValueError exception if there is an encoding error\n(the default of None has the same effect), or pass 'ignore' to ignore\nerrors. (Note that ignoring encoding errors can lead to data loss.)\nSee the documentation for codecs.register or run 'help(codecs.Codec)'\nfor a list of the permitted encoding error strings.\n\nnewline controls how universal newlines works (it only applies to text\nmode). It can be None, '', '\\n', '\\r', and '\\r\\n'.  It works as\nfollows:\n\n* On input, if newline is None, universal newlines mode is\n  enabled. Lines in the input can end in '\\n', '\\r', or '\\r\\n', and\n  these are translated into '\\n' before being returned to the\n  caller. If it is '', universal newline mode is enabled, but line\n  endings are returned to the caller untranslated. If it has any of\n  the other legal values, input lines are only terminated by the given\n  string, and the line ending is returned to the caller untranslated.\n\n* On output, if newline is None, any '\\n' characters written are\n  translated to the system default line separator, os.linesep. If\n  newline is '' or '\\n', no translation takes place. If newline is any\n  of the other legal values, any '\\n' characters written are translated\n  to the given string.\n\nIf closefd is False, the underlying file descriptor will be kept open\nwhen the file is closed. This does not work when a file name is given\nand must be True in that case.\n\nA custom opener can be used by passing a callable as *opener*. The\nunderlying file descriptor for the file object is then obtained by\ncalling *opener* with (*file*, *flags*). *opener* must return an open\nfile descriptor (passing os.open as *opener* results in functionality\nsimilar to passing None).\n\nopen() returns a file object whose type depends on the mode, and\nthrough which the standard file operations such as reading and writing\nare performed. When open() is used to open a file in a text mode ('w',\n'r', 'wt', 'rt', etc.), it returns a TextIOWrapper. When used to open\na file in a binary mode, the returned class varies: in read binary\nmode, it returns a BufferedReader; in write binary and append binary\nmodes, it returns a BufferedWriter, and in read/write mode, it returns\na BufferedRandom.\n\nIt is also possible to use a string or bytearray as a file for both\nreading and writing. For strings StringIO can be used like a file\nopened in a text mode, and for bytes a BytesIO can be used like a file\nopened in a binary mode."
"typing.cast" = "cast(typ: str, val: Any) -> Any\ncast(typ: object, val: Any) -> Any\n\nCast a value to a type.\n\nThis returns the value unchanged.  To the type checker this\nsignals that the return value has the designated type, but at\nruntime we intentionally don't check anything (we want this\nto be as fast as possible)."
"virtual_ecosystem.models.palms.palms_model.PalmsModel.estimate_gpp" = "Estimate the gross primary productivity within plant cohorts.\n\nThis method uses estimated light use efficiency from the P Model to estimate the\nlight use efficiency of leaves in gC mol-1, given the environment (temperature,\natmospheric pressure, vapour pressure deficit and atmospheric CO2 concentration)\nwithin each canopy layer. This is multiplied by the absorbed irradiance within\neach canopy layer to predict the gross primary productivity (GPP, µg C m-2 s-1)\nfor each canopy layer.\n\nThis method requires that the calculate_light_use_efficiency method has been run\nto populate the\n:attr:`~virtual_ecosystem.models.palms.palms_model.PalmsModel.pmodel`\nattribute.\n\nThe GPP for each cohort is then estimated by multiplying the cohort canopy area\nwithin each layer by GPP and the time elapsed in seconds since the last update.\n\n.. TODO:\n\n    * Conversion of transpiration from `µmol m-2` to `mm m-2` currently ignores\n      density changes with conditions:\n      `#723 <https://github.com/ImperialCollegeLondon/virtual_ecosystem/issues/723>`_\n\nArgs:\n    time_index: The index along the time axis of the forcing data giving the\n        time step to be used to estimate GPP."
"virtual_ecosystem.models.palms.palms_model.PalmsModel.populate_lignin_proportions" = "Populate lignin proportions of all the plant biomass pools.\n\nThis function populates the lignin concentrations of each plant biomass pool.\n\nWarning:\n    At present, this function literally just populates constant values for\n    lignin, so this function is just called once during model initialise to\n    create an array of constant values, which are then used for the rest of the\n    model run."
"xarray.core.common.full_like" = "full_like(other: Dataset, fill_value: Any, dtype: DTypeMaybeMapping | None=None, *, chunks: T_Chunks=None, chunked_array_type: str | None=None, from_array_kwargs: dict[str, Any] | None=None) -> Dataset\nfull_like(other: Variable, fill_value: Any, dtype: DTypeLikeSave | None=None, *, chunks: T_Chunks=None, chunked_array_type: str | None=None, from_array_kwargs: dict[str, Any] | None=None) -> Variable\nfull_like(other: Dataset | DataArray, fill_value: Any, dtype: DTypeMaybeMapping | None=None, *, chunks: T_Chunks={}, chunked_array_type: str | None=None, from_array_kwargs: dict[str, Any] | None=None) -> Dataset | DataArray\nfull_like(other: Dataset | DataArray | Variable, fill_value: Any, dtype: DTypeMaybeMapping | None=None, *, chunks: T_Chunks=None, chunked_array_type: str | None=None, from_array_kwargs: dict[str, Any] | None=None) -> Dataset | DataArray | Variable\n\nReturn a new object with the same shape and type as a given object.\n\nReturned object will be chunked if if the given object is chunked, or if chunks or chunked_array_type are specified.\n\nParameters\n----------\nother : DataArray, Dataset or Variable\n    The reference object in input\nfill_value : scalar or dict-like\n    Value to fill the new object with before returning it. If\n    other is a Dataset, may also be a dict-like mapping data\n    variables to fill values.\ndtype : dtype or dict-like of dtype, optional\n    dtype of the new array. If a dict-like, maps dtypes to\n    variables. If omitted, it defaults to other.dtype.\nchunks : int, \"auto\", tuple of int or mapping of Hashable to int, optional\n    Chunk sizes along each dimension, e.g., ``5``, ``\"auto\"``, ``(5, 5)`` or\n    ``{\"x\": 5, \"y\": 5}``.\nchunked_array_type: str, optional\n    Which chunked array type to coerce the underlying data array to.\n    Defaults to 'dask' if installed, else whatever is registered via the `ChunkManagerEnetryPoint` system.\n    Experimental API that should not be relied upon.\nfrom_array_kwargs: dict, optional\n    Additional keyword arguments passed on to the `ChunkManagerEntrypoint.from_array` method used to create\n    chunked arrays, via whichever chunk manager is specified through the `chunked_array_type` kwarg.\n    For example, with dask as the default chunked array type, this method would pass additional kwargs\n    to :py:func:`dask.array.from_array`. Experimental API that should not be relied upon.\n\nReturns\n-------\nout : same as object\n    New object with the same shape and type as other, with the data\n    filled with fill_value. Coords will be copied from other.\n    If other is based on dask, the new one will be as well, and will be\n    split in the same chunks.\n\nExamples\n--------\n>>> x = xr.DataArray(\n...     np.arange(6).reshape(2, 3),\n...     dims=[\"lat\", \"lon\"],\n...     coords={\"lat\": [1, 2], \"lon\": [0, 1, 2]},\n... )\n>>> x\n<xarray.DataArray (lat: 2, lon: 3)> Size: 48B\narray([[0, 1, 2],\n       [3, 4, 5]])\nCoordinates:\n  * lat      (lat) int64 16B 1 2\n  * lon      (lon) int64 24B 0 1 2\n\n>>> xr.full_like(x, 1)\n<xarray.DataArray (lat: 2, lon: 3)> Size: 48B\narray([[1, 1, 1],\n       [1, 1, 1]])\nCoordinates:\n  * lat      (lat) int64 16B 1 2\n  * lon      (lon) int64 24B 0 1 2\n\n>>> xr.full_like(x, 0.5)\n<xarray.DataArray (lat: 2, lon: 3)> Size: 48B\narray([[0, 0, 0],\n       [0, 0, 0]])\nCoordinates:\n  * lat      (lat) int64 16B 1 2\n  * lon      (lon) int64 24B 0 1 2\n\n>>> xr.full_like(x, 0.5, dtype=np.double)\n<xarray.DataArray (lat: 2, lon: 3)> Size: 48B\narray([[0.5, 0.5, 0.5],\n       [0.5, 0.5, 0.5]])\nCoordinates:\n  * lat      (lat) int64 16B 1 2\n  * lon      (lon) int64 24B 0 1 2\n\n>>> xr.full_like(x, np.nan, dtype=np.double)\n<xarray.DataArray (lat: 2, lon: 3)> Size: 48B\narray([[nan, nan, nan],\n       [nan, nan, nan]])\nCoordinates:\n  * lat      (lat) int64 16B 1 2\n  * lon      (lon) int64 24B 0 1 2\n\n>>> ds = xr.Dataset(\n...     {\"a\": (\"x\", [3, 5, 2]), \"b\": (\"x\", [9, 1, 0])}, coords={\"x\": [2, 4, 6]}\n... )\n>>> ds\n<xarray.Dataset> Size: 72B\nDimensions:  (x: 3)\nCoordinates:\n  * x        (x) int64 24B 2 4 6\nData variables:\n    a        (x) int64 24B 3 5 2\n    b        (x) int64 24B 9 1 0\n>>> xr.full_like(ds, fill_value={\"a\": 1, \"b\": 2})\n<xarray.Dataset> Size: 72B\nDimensions:  (x: 3)\nCoordinates:\n  * x        (x) int64 24B 2 4 6\nData variables:\n    a        (x) int64 24B 1 1 1\n    b        (x) int64 24B 2 2 2\n>>> xr.full_like(ds, fill_value={\"a\": 1, \"b\": 2}, dtype={\"a\": bool, \"b\": float})\n<xarray.Dataset> Size: 51B\nDimensions:  (x: 3)\nCoordinates:\n  * x        (x) int64 24B 2 4 6\nData variables:\n    a        (x) bool 3B True True True\n    b        (x) float64 24B 2.0 2.0 2.0\n\nSee Also\n--------\nzeros_like\nones_like"
"virtual_ecosystem.models.palms.palms_model.PalmsModel.allocate_gpp" = "Calculate the allocation of GPP to growth and respiration.\n\nThis method uses palm growth form equations analogous to the T Model to\nestimate the allocation of plant gross primary productivity to respiration,\ngrowth, maintenance and turnover costs. The method then simulates growth by\nincreasing stem height and calculates leaf and root turnover values."
"numpy._core.fromnumeric.sum" = "sum(a: _NestedSequence[list[float]] | list[float], axis: int | tuple[int, ...], dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _FloatLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.float64]\nsum(a: _NestedSequence[list[float]] | list[float], axis: int | tuple[int, ...] | None=None, dtype: None=None, out: None=None, *, keepdims: Literal[True], initial: _FloatLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.float64]\nsum(a: _NestedSequence[list[complex]] | list[complex], axis: None=None, dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> np.complex128\nsum(a: _NestedSequence[list[complex]] | list[complex], axis: int | tuple[int, ...], dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.complex128]\nsum(a: _NestedSequence[list[complex]] | list[complex], axis: int | tuple[int, ...] | None=None, dtype: None=None, out: None=None, *, keepdims: Literal[True], initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.complex128]\nsum(a: _ArrayLike[ScalarT], axis: None=None, dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> ScalarT\nsum(a: _ArrayLike[ScalarT], axis: int | tuple[int, ...], dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[ScalarT]\nsum(a: ArrayT, axis: int | tuple[int, ...] | None=None, dtype: None=None, out: None=None, *, keepdims: Literal[True], initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> ArrayT\nsum(a: _DualArrayLike[np.dtype[np.bool | np.integer], int], axis: None=None, dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _IntLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> np.int_\nsum(a: _DualArrayLike[np.dtype[np.bool | np.integer], int], axis: int | tuple[int, ...], dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _IntLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> NDArray[np.int_]\nsum(a: np.ndarray[ShapeT, np.dtype[np.bool | np.integer]], axis: int | tuple[int, ...] | None=None, dtype: None=None, out: None=None, *, keepdims: Literal[True], initial: _IntLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[np.int_]]\nsum(a: _SupportsArray[np.dtype[np.object_]], axis: None=None, dtype: None=None, out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> Any\nsum(a: _ArrayLikeNumeric_co, axis: None=None, *, dtype: _DTypeLike[ScalarT], out: None=None, keepdims: Literal[False] | _NoValueType=..., initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> ScalarT\nsum(a: np.ndarray[ShapeT, np.dtype[np.number | np.bool | np.timedelta64 | np.object_]], axis: int | tuple[int, ...] | None=None, *, dtype: _DTypeLike[ScalarT], out: None=None, keepdims: Literal[True], initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[ShapeT, np.dtype[ScalarT]]\nsum(a: np.ndarray[ShapeT, np.dtype[np.number | np.bool | np.timedelta64 | np.object_]], axis: int | tuple[int, ...] | None, dtype: _DTypeLike[ScalarT], out: None=None, *, keepdims: Literal[True], initial: _NumberLike_co | _NoValueType=..., where: _ArrayLikeBool_co | _NoValueType=...) -> np.ndarray[Sha
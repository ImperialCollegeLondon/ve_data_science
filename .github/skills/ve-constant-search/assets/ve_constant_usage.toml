"virtual_ecosystem.models.abiotic.microclimate.run_hour_step" = "Run one hour step of the microclimate model.\n\nThis function will be called iteratively for each hour in the day, updating the\nstate variables based on the calculated fluxes and thermodynamics.\n\nArgs:\n    state: Current state variables for microclimate model\n    static: Prepared static inputs for microclimate model\n    hourly_forcing: Generated hourly profiles for atmospheric forcing variables\n    hour: Current hour index\n    idx: SimpleNamespace with layer indices\n    layer_structure: LayerStructure\n    abiotic_constants: Set of constants for abiotic model\n    core_constants: Set of constants that are shared across all models\n    pyrealm_core_constants: Set of constants from pyrealm core that are used in\n        calculations\n    abiotic_bounds: Set of bounds for abiotic values\n    time_interval: Time interval for flux calculations, [s]"
"virtual_ecosystem.models.abiotic.energy_balance.update_soil_temperature" = "Update soil temperature using moisture-dependent heat diffusion.\n\nThis function applies an explicit finite-difference temperature update for\nsoil while allowing thermal properties to vary with soil moisture. Moisture\ninfluences temperature evolution through both volumetric heat capacity and\nthermal conductivity.\n\nVolumetric heat capacity is represented as:\n\n.. math::\n    C_{vol} = \\rho_b c_s + \\theta \\rho_w c_w\n\nwhere ``rho_b`` is soil bulk density, ``c_s`` is the specific heat capacity\nof soil solids, ``theta`` is volumetric soil moisture, ``rho_w`` is water\ndensity and ``c_w`` is the specific heat capacity of water.\n\nSoil thermal conductivity is estimated using a Johansen-style unfrozen-soil\nparameterisation. Conductivity is interpolated nonlinearly between the conductivity\nof dry soil and the conductivity of saturated soil using a Kersten number based on\ndegree of saturation, with separate empirical forms for coarse- and fine-textured\nsoils.\n\nSoil thermal diffusivity is then:\n\n.. math::\n    \\alpha = \\lambda / C_{vol}\n\nInternal layer update:\n\n.. math::\n    T_i^{t+\\Delta t} = T_i^t + (\\Delta t / \\Delta z_i^2)\n    \\alpha_i (T_{i+1}^t - 2T_i^t + T_{i-1}^t)\n\nTop layer update with ground heat flux:\n\n.. math::\n    T_0^{t+\\Delta t} = T_0^t +\n    \\frac{\\Delta t}{C_{vol,0} \\Delta z_0} G\n\nBottom boundary condition:\n\n.. math::\n    \\frac{\\partial T}{\\partial z} = 0\n\nimplemented as a no-heat-flux lower boundary.\n\nThe update is performed using a forward-in-time, centred-in-space explicit\nfinite-difference scheme for the one-dimensional heat equation following\n:cite:t:`incropera_fundamentals_2007`.\n\nThe timestep should satisfy the usual stability condition for diffusion problems,\napproximately ``alpha * dt / dz**2 \\lesssim 0.5`` for each layer.\n\nArgs:\n    ground_heat_flux: Ground heat flux into the top soil layer, [W m-2].\n    soil_temperature: Soil temperature for each layer and cell, [C].\n    soil_layer_thickness: Thickness of each soil layer, [m].\n    soil_moisture_volumetric: Volumetric soil moisture, [m3 m-3].\n    soil_porosity: Soil porosity, [m3 m-3].\n    soil_thermal_conductivity_dry: Dry-soil thermal conductivity,\n        [W m-1 K-1].\n    soil_thermal_conductivity_saturated: Saturated-soil thermal conductivity,\n        [W m-1 K-1].\n    soil_bulk_density: Soil bulk density, [kg m-3].\n    specific_heat_capacity_soil: Specific heat capacity of soil solids,\n        [J kg-1 K-1].\n    time_interval: Timestep, [s].\n    density_water: Water density, [kg m-3].\n    specific_heat_capacity_water: Specific heat capacity of water,\n        [J kg-1 K-1].\n    coarse_kersten_factor: Empirical factor for adjusting Kersten numbers for\n        coarse-textured soils, [unitless].\n    is_coarse_textured: Boolean flag identifying coarse-textured soil for\n        the Johansen Kersten number. May be scalar or broadcastable to the\n        soil field shape."
"virtual_ecosystem.models.abiotic.microclimate.run_microclimate" = "Run the microclimate model for one day, iterating through hourly time steps.\n\nThis function prepares static inputs, calculates wind profiles, generates hourly\nforcing, initializes state and record variables, and then iteratively updates the\nstate variables based on calculated fluxes and thermodynamics for each hour.\n\nArgs:\n    data: Data object containing all model variables and grid information\n    vars_updated: Tuple containing strings of all variables that are updated by\n        abiotic model\n    time_index: Time index for the current day in the data\n    time_dim: Number of time steps in the hourly record (e.g., 24 for a full day)\n    time_interval: Time interval for flux calculations, [s]\n    month: Current month (1-12) for generating diurnal cycle\n    days: Number of days per month\n    latitude: Latitude of the location, [degrees]\n    layer_structure: Layer structure object with information on number of layers\n        and their indices\n    abiotic_constants: Set of constants for abiotic model\n    core_constants: Set of constants that are shared across all models\n    pyrealm_core_constants: Set of constants from pyrealm\n    abiotic_bounds: Bounds for air temperature to ensure physical realism"
"virtual_ecosystem.models.abiotic.abiotic_tools.calculate_specific_humidity" = "Calculate specific humidity.\n\nArgs:\n    air_temperature: Air temperature, [C]\n    relative_humidity: Relative humidity, [%]\n    atmospheric_pressure: Atmospheric pressure, [kPa]\n    molecular_weight_ratio_water_to_dry_air: The ratio of the molar mass of water\n        vapour to the molar mass of dry air\n    pyrealm_core_constants: Pyrealm core constants"
"virtual_ecosystem.models.abiotic.energy_balance.update_humidity_vpd" = "Update atmospheric humidity and vapour pressure deficit.\n\nArgs:\n    saturated_vapour_pressure: Saturated vapour pressure, [kPa]\n    specific_humidity_mixed: Specific humidity vertically mixed, [kg kg-1]\n    atmospheric_pressure: Atmospheric pressure, [kPa]\n    layer_thickness: Layer thickness, [m]\n    molecular_weight_ratio_water_to_dry_air: Molecular weight ratio of water to dry\n        air, dimensionless\n    dry_air_factor: Complement of water_to_air_mass_ratio, accounting for dry air\n    density_air: Density of air, [kg m-3]\n    cell_area: Grid cell area, [m2]\n    limits_relative_humidity: Realistic bounds of relative humidity, []\n    limits_vapour_pressure_deficit: Realistic bounds for vapour pressure deficit,\n        [kPa]\n    denominator_tolerance: Small value to prevent division by zero"
"virtual_ecosystem.models.hydrology.hydrology_tools.calculate_psychrometric_constant" = "Calculate the psychrometric constant.\n\nNOTE this might be replaced with pyrealm implementation\n\nArgs:\n    atmospheric_pressure: Atmospheric pressure, [KPa].\n    latent_heat_vapourization: Latent heat of vaporization, [kJ kg-1]\n    specific_heat_air: Specific heat of air at constant pressure, [kJ kg-1 K-1]\n    molecular_weight_ratio_water_to_dry_air: Ratio of molecular weights of water to\n        dry air"
"numpy._core.fromnumeric.repeat" = "repeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: SupportsIndex) -> NDArray[ScalarT]\nrepeat(a: ArrayLike, repeats: _ArrayLikeInt_co, axis: None=None) -> _Array1D[Any]\nrepeat(a: ArrayLike, repeats: _ArrayLikeInt_co, axis: SupportsIndex) -> NDArray[Any]\nrepeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: None=None) -> _Array1D[ScalarT]\nrepeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: SupportsIndex) -> NDArray[ScalarT]\nrepeat(a: ArrayLike, repeats: _ArrayLikeInt_co, axis: None=None) -> _Array1D[Any]\nrepeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: None=None) -> _Array1D[ScalarT]\nrepeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: SupportsIndex) -> NDArray[ScalarT]\nrepeat(a: _ArrayLike[ScalarT], repeats: _ArrayLikeInt_co, axis: None=None) -> _Array1D[ScalarT]\n\nRepeat each element of an array after themselves\n\nParameters\n----------\na : array_like\n    Input array.\nrepeats : int or array of ints\n    The number of repetitions for each element.  `repeats` is broadcasted\n    to fit the shape of the given axis.\naxis : int, optional\n    The axis along which to repeat values.  By default, use the\n    flattened input array, and return a flat output array.\n\nReturns\n-------\nrepeated_array : ndarray\n    Output array which has the same shape as `a`, except along\n    the given axis.\n\nSee Also\n--------\ntile : Tile an array.\nunique : Find the unique elements of an array.\n\nExamples\n--------\n>>> import numpy as np\n>>> np.repeat(3, 4)\narray([3, 3, 3, 3])\n>>> x = np.array([[1,2],[3,4]])\n>>> np.repeat(x, 2)\narray([1, 1, 2, 2, 3, 3, 4, 4])\n>>> np.repeat(x, 3, axis=1)\narray([[1, 1, 1, 2, 2, 2],\n       [3, 3, 3, 4, 4, 4]])\n>>> np.repeat(x, [1, 2], axis=0)\narray([[1, 2],\n       [3, 4],\n       [3, 4]])"
"virtual_ecosystem.core.data.Data.load_data_config" = "Setup the simulation data from a user configuration.\n\nThis is a method is used to validate a provided user data configuration and\npopulate the Data instance object from the provided data sources. The\ndata_config dictionary can contain a 'variable' key containing an array of\ndictionaries providing the path to the file (``file_path``) and the name of the\nvariable within the file (``var_name``). The function groups variables by their\nsource file path, so that each file is only opened once to load the requested\nvariables.\n\nArgs:\n    config: A validated Virtual Ecosystem model configuration object."

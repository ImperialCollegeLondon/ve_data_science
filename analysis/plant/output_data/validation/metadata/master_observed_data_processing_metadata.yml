        Propagated of standard error of NPP and autotrophic respiration
      references:
      - citation: Riutta et al. (2021)
        doi: https://doi.org/10.5281/zenodo.7307449
        url: https://zenodo.org/records/7307449
        origin: Maliau Basin, Sabah, Malaysia
        biome: tropical

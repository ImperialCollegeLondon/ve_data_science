- script_path: symbiote_allocation_comparison_maliau_2.R
  title: symbiote_allocation_comparison_maliau_2
  description: |
    Compares the cell-level Virtual Ecosystem symbiote allocation prediction
    with the observed allocation derived from total NPP with and without
    mycorrhiza for Maliau scenario 2.
  virtual_ecosystem_module: Plant
  author: Arne Scheire
  status: final
  input_files:
  - name: carbon_balance_components_maliau.csv
    path: data/derived/plant/output_data/validation/observed_data_processing
    description: Observed carbon-balance components and derived symbiote allocation.
  - name: master_observed_data_processing_metadata.yml
    path: analysis/plant/output_data/validation/metadata
    description: Variable-specific observed measurement periods.
  - name: symbiote_allocation_maliau_2.csv
    path: data/derived/plant/output_data/validation/predicted_outputs_processing
    description: Standardised symbiote allocation by cell and timestep.
  - name: symbiote_allocation_mapping_maliau_2.yml
    path: analysis/plant/output_data/validation/variable_mapping
    description: Observed and predicted symbiote-allocation mapping.
  output_files:
  - name: symbiote_allocation_comparison_maliau_2.csv
    path: data/derived/plant/output_data/validation/comparisons
    description: |
      One row per observed plot and mapped variable, including observed SE,
      pooled cell-total model SD, spatial/temporal extents, and aggregation
      statuses. Observed SE is NA because it is unavailable for the derived
      allocation value.
  package_dependencies: yaml
  usage_notes: |
    Run from this script's directory. Observed allocation is calculated as
    TotalNPP_WithMycorrhiza minus TotalNPP_WithoutMycorrhiza. Observed values
    are per plot and period-averaged; predictions are pooled across unique
    cells and timesteps in the selected period. Both use Mg C ha-1 year-1.
    Predicted SD describes pooled cell-timestep variability, not prediction
    uncertainty. The observed SE is unavailable and recorded as NA.

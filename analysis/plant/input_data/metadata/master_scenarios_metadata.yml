        Number of seeds per mature fruit.
      references:
      - citation: Nakagawa and Nakashizuka (2004)
        doi: https://doi.org/10.1079/SSR2004181
        url: ~
        origin: ~
        biome: tropical
        vegetation_type: dipterocarp forest
        site_condition: ~
        date: ~
      assumptions: 'Joined from stoichiometry_maliau.csv using the PFT name. Original
        assumption: Assumed to be one seed per fruit for dipterocarps.'
    - name: stem_c_n_ratio
      type: numeric
      units: g C g^-1 N
      description: |
        Carbon-to-nitrogen ratio for sapwood / deadwood tissue.

        biome: tropical
        vegetation_type: dipterocarp forest
        site_condition: ~
        date: ~
      - citation: Nakagawa and Nakashizuka (2004)
        doi: https://doi.org/10.1079/SSR2004181
        url: ~
        origin: ~
        biome: tropical
        vegetation_type: dipterocarp forest
        site_condition: ~
        date: ~
      assumptions: 'Joined from stoichiometry_maliau.csv using the PFT name. Original
        assumption: Derived using seed dry mass from Nakagawa and Nakashizuka with

      - citation: ~
        doi: ~
        url: ~
        origin: ~
        biome: ~
        vegetation_type: ~
        site_condition: ~
        date: ~
      assumptions: Assigned in this script as the Maliau 2 scenario value.
    - name: root_symbiote_npp_fraction
      type: numeric
      units: dimensionless

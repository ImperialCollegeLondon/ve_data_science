        url: ~
        origin: ~
        biome: ~
        vegetation_type: ~
        site_condition: ~
        date: ~
      assumptions: The variable name identifies the quantity represented by the value
        column; the applicable source is recorded in the source column.
    - name: approach
      type: character
      units: dimensionless

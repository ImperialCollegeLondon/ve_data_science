###############################################################################
# Parameter definitions for sensitivity analysis
#
# Author: Lelavathy Samikan
#
# Purpose:
#   Hydrology-focused global sensitivity analysis for undisturbed tropical
#   forest conditions.
#
# Sampling methods:
#   - Sobol
#   - Morris
#   - Latin Hypercube
#
# Important:
#   The ranges below are literature-informed plausible ranges for tropical
#   forest soils and hydrological behaviour. Where a VE parameter is a
#   conceptual/model parameter rather than a directly measurable field
#   property, the range is deliberately treated as a plausible uncertainty
#   range around the VE default rather than as a measured tropical range.
###############################################################################

[hydrology]

[[hydrology.constants]]
name = "soil_moisture_residual"
bounds = [0.10, 0.25]

[[hydrology.constants]]
name = "soil_moisture_saturation"
bounds = [0.40, 0.70]

[[hydrology.constants]]
name = "saturated_hydraulic_conductivity"
bounds = [6.0e-6, 8.0e-4]

[[hydrology.constants]]
name = "van_genuchten_nonlinearily_parameter"
bounds = [1.20, 2.00]

[[hydrology.constants]]
name = "pore_connectivity_parameter"
bounds = [0.30, 0.70]

[[hydrology.constants]]
name = "air_entry_potential_inverse"
bounds = [0.01, 0.10]

[[hydrology.constants]]
name = "groundwater_capacity"
bounds = [200.0, 1500.0]

[[hydrology.constants]]
name = "max_percolation_rate_uzlz"
bounds = [0.5, 10.0]

[[hydrology.constants]]
name = "groundwater_loss"
bounds = [0.10, 5.0]

[[hydrology.constants]]
name = "reservoir_const_upper_groundwater"
bounds = [5.0, 60.0]

[[hydrology.constants]]
name = "reservoir_const_lower_groundwater"
bounds = [5.0, 60.0]

[[hydrology.constants]]
name = "bypass_flow_coefficient"
bounds = [0.10, 2.00]

[[hydrology.constants]]
name = "stormflow_coefficient"
bounds = [0.10, 2.00]

[[hydrology.constants]]
name = "saturation_exponent"
bounds = [1.0, 3.0]

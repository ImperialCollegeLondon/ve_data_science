[core.grid]
# cell_area, cell_nx and cell_ny of Maliau 2 happens to be the same as the
# default, but it feels weird to remove them...
cell_area = 10000
cell_nx = 10
cell_ny = 10
xoff = 495559.3
yoff = 524298.8

[core.timing]
start_date = "2010-01-01"
update_interval = "1 month" # this is also the default, but feels weird to remove
run_length = "11 years"

[core.data_output_options]
out_path = "../output" # with this we can remove --out ../output in ve_run?

# Climate data

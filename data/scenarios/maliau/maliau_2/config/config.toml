# Core settings
[core.grid]
cell_area = 10000
cell_nx = 10
cell_ny = 10
xoff = 495559.3
yoff = 524298.8

[core.timing]
start_date = "2010-01-01"
update_interval = "1 month"
run_length = "11 years"

# Climate data
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "air_temperature_ref"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "relative_humidity_ref"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "atmospheric_pressure_ref"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "precipitation"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "atmospheric_co2_ref"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "mean_annual_temperature"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "wind_speed_ref"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "downward_longwave_radiation"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "diurnal_temperature_range_ref"

# Elevation
[[core.data.variable]]
file_path = "../data/elevation_maliau_10x10.nc"
var_name = "elevation"

[abiotic_simple]

# Animal config settings
# This configuration currently uses Maliau Level 3 FG
# A simpler Level 1 FG is also available through Globus.

[animal]
functional_group_definitions_path = "../data/animal_functional_groups_Maliau_level3.csv"

[animal.cohort_data_export]
enabled = true
float_format = "%0.5f"

[animal.resource_pool_export]
enabled = true
float_format = "%0.5f"

[hydrology]

# Plant config settings
[plants]

# Plant pft definitions file path
pft_definitions_path = "../data/plant_pft_definitions_maliau_2.csv"
# Plant cohort data file path
cohort_data_path = "../data/cohort_data_1_cm_maliau_2.csv"

# Plant output data export settings
[plants.community_data_export]
required_data = ["cohorts","community_canopy","stem_canopy"]
cohort_attributes = []
community_canopy_attributes = []
stem_canopy_attributes = []

# Plant array variables
[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "plant_pft_propagules"
[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "subcanopy_vegetation_biomass"
[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "subcanopy_seedbank_biomass"
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "downward_shortwave_radiation"

# Plant constants (non-defaults)
[plants.constants]
subcanopy_specific_leaf_area = 73.4169120128073

# Core settings
[core]

[core.grid]
cell_area = 10000
cell_nx = 10
cell_ny = 10
xoff = 495559.3
yoff = 524298.8

[core.timing]
start_date = "2010-01-01"
update_interval = "1 month"
run_length = "11 years"

# Abiotic simple settings
[abiotic_simple]

# Abiotic simple array variables
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "air_temperature_ref"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "relative_humidity_ref"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "atmospheric_pressure_ref"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "atmospheric_co2_ref"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "mean_annual_temperature"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "wind_speed_ref"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "downward_longwave_radiation"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "diurnal_temperature_range_ref"

# Hydrology settings
[hydrology]

# Hydrology array variables
[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "precipitation"

[[core.data.variable]]
file_path = "../data/elevation_maliau_10x10.nc"
var_name = "elevation"

# Animal settings
[animal]
# Animal functional group definitions file path.
# Currently uses Maliau_level3, other levels are also available through Globus.
functional_group_definitions_path = "../data/animal_functional_groups_Maliau_level3.csv"

[animal.cohort_data_export]
enabled = true

[animal.resource_pool_export]
enabled = true

# Plants settings
[plants]
# Plant cohort input data file path.
cohort_data_path = "../data/cohort_data_1_cm_maliau_2.csv"
# Plant functional type definitions file path.
pft_definitions_path = "../data/plant_pft_definitions_maliau_2.csv"

# Plant community data export settings
[plants.community_data_export]
required_data = ["cohorts", "community_canopy", "stem_canopy"]
cohort_attributes = []
community_canopy_attributes = []
stem_canopy_attributes = []

# Plants array variables
[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "plant_pft_propagules"

[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "subcanopy_vegetation_biomass"

[[core.data.variable]]
file_path = "../data/plant_input_data_maliau_2.nc"
var_name = "subcanopy_seedbank_biomass"

[[core.data.variable]]
file_path = "../data/era5_maliau_10x10_2010_2020.nc"
var_name = "downward_shortwave_radiation"

# Plant constants with scenario-specific overrides
[plants.constants]
subcanopy_specific_leaf_area = 73.4169
subcanopy_reproductive_allocation = 0.2235
subcanopy_respiration_fraction = 0.132
subcanopy_extinction_coef = 0.48
subcanopy_yield = 0.68
subcanopy_vegetation_turnover = 2.5714
subcanopy_vegetation_c_n_ratio = 17.2011
subcanopy_vegetation_c_p_ratio = 206.6683
subcanopy_vegetation_lignin = 0.2919
subcanopy_seedbank_turnover = 0.32
subcanopy_sprout_rate = 0.68
subcanopy_sprout_yield = 0.68
subcanopy_seedbank_c_n_ratio = 64.0759
subcanopy_seedbank_c_p_ratio = 82.9836
subcanopy_seedbank_lignin = 0.1778
per_stem_annual_mortality_probability = 0.02
per_propagule_annual_recruitment_probability = 0.0207
root_exudates = 0.047
dsr_to_ppfd = 2.04
stem_lignin = 0.3132
senesced_leaf_lignin = 0.29
plant_reproductive_tissue_lignin = 0.1778
root_lignin = 0.3042


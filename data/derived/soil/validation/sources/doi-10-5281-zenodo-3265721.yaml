  notes:
    Contains total aboveground litter mass (leaf, reproduction, twig). Unit of
    measurement was g in the dataset, but Robert Ewers confirmed that the litter
    trap area was 1 m x 1 m. Litter mass is total biomass, not carbon mass. Most
    of the litter trap datasets will be total biomass, not carbon mass; we need
    to discuss if we simply discard total litter mass datasets, or convert total
    mass to carbon mass using a fixed ratio. I guess it depends on how much
    litter validation datasets we can get at the end without having to assume
    such a fixed ratio.

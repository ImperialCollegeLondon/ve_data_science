  notes: This is a different dataset from Sarah Luke and March. The sheet “Leaf_litter_invertebrates”
    which has 1m^2 quadrat for every 7m along a 100m transect. Location coordinates
    only known for each transect so to process this dataset, we would combine abundance/density
    from all 15 quadrats to compare with model output density. Lots of invert genera
    are represented here – are the functional groups fully represented? I think yes.
    If not,  predicted and observed should be converted to min-max (0-1) to account
    for missing groups. We will only use control groups as termite suspensions (Termite
    in datasheet) are the groups that exclude ground termites.

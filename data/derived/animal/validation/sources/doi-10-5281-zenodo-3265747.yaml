  notes: Dataset has time series dataset of ant and other invertebrate abundance measured
    fortnightly at bait monitoring cards. Weight of bait removed is measured with
    either ants or vertebrates excluded. Baits are biscuit, seed, fish. These could
    be used to validate mass flow of these baits to vertebrates (cage-open, plot_treat-control,
    inverts (cage-closed, plot_treat-control), ants (cage-closed, plot_treat-ant).
    Locations are similar to Ashton litter invertebrate density. A bit lower priority
    to validate seed is not yet a pool to validate and I am not sure which resource
    pool biscuit belong to in our model?

  notes: This dataset has twig-nesting ant community colony  data. They examined the
    number of twigs in 1m^2 sub-plot quadrat to look for number of colonies (a colony
    has at least one queen, or at least two workers with brood). One way to use this
    data is to assume an average number of ants per colony, ideally in different genera.
    Using that average, we can multiply it by the number of colonies to get abundance
    and hence density.

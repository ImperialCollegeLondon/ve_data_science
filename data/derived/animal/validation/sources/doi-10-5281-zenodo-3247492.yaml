  notes: 'Dataset is similar to  the one from 2015 from Slade, just the sites are
    different, here they are Maliau, SAFE and oil palm sites. Dataset includes wet
    weight of dung removal in 24 hours in RT sites in 2015. Here we have absolute
    daily removal prorportion rate. This can be compared with the model output of
    scavenged mass on the excrement pool. Question: Should the observed daily dung
    removal be 1) compared with the constant of excrement scavenging from the model
    or 2) compared with calculated excrement scavenged rate from model output (mass
    taken from scavenge_excrement_pool) of the exact day of observed data?'

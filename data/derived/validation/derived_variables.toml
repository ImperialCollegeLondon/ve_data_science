[[variable]]
name = "total_soil_n_per_volume"
description = "Total soil nitrogen per volume"
unit = "kg{N} m^-3"
function = "get_total_soil_n_per_volume"

[[variable]]
name = "total_soil_c_per_volume"
description = "Total soil carbon per volume"
unit = "kg{C} m^-3"
function = "get_total_soil_c_per_volume"

[[variable]]
name = "total_soil_p_per_volume"
description = "Total soil phosphorous per volume"
unit = "kg{P} m^-3"
function = "get_total_soil_p_per_volume"

[[variable]]
name = "total_soil_n_per_mass"
description = "Total soil nitrogen per mass"
unit = "kg{N} kg^-1"
function = "get_total_soil_n_per_mass"

[[variable]]
name = "total_soil_c_per_mass"
description = "Total soil carbon per mass"
unit = "kg{C} kg^-1"
function = "get_total_soil_c_per_mass"

[[variable]]
name = "total_soil_p_per_mass"
description = "Total soil phosphorous per mass"
unit = "kg{P} kg^-1"
function = "get_total_soil_p_per_mass"

[[variable]]
name = "total_soil_c_per_area"
description = "Total soil carbon per area"
unit = "kg{C} m^-2"
function = "get_total_soil_c_per_area"

[[variable]]
name = "total_soil_n_per_area"
description = "Total soil nitrogen per area"
unit = "kg{N} m^-2"
function = "get_total_soil_n_per_area"

[[variable]]
name = "total_soil_p_per_area"
description = "Total soil phosphorous per area"
unit = "kg{P} m^-2"
function = "get_total_soil_p_per_area"

[[variable]]
name = "soil_n_pool_ammonium_per_mass"
description = "Mass-basis of nitrogen contained in the soil ammonium (NH4+) pool"
unit = "kg{N} kg^-1"
function = "get_soil_n_pool_ammonium_per_mass"

[[variable]]
name = "soil_n_pool_nitrate_per_mass"
description = "Mass-basis amount of nitrogen contained in the soil nitrate (NO3-) pool"
unit = "kg{N} kg^-1"
function = "get_soil_n_pool_nitrate_per_mass"

[[variable]]
name = "soil_p_pool_labile_per_mass"
description = "Mass-basis amount of inorganic phosphorus that is in a labile form"
unit = "kg{P} kg^-1"
function = "get_soil_p_pool_labile_per_mass"

[[variable]]
name = "soil_n_pool_inorganic_per_volume"
description = "Total inorganic soil nitrogen per volume"
unit = "kg{N} m^-3"
function = "get_soil_n_pool_inorganic_per_volume"

[[variable]]
name = "soil_n_pool_inorganic_per_area"
description = "Total inorganic soil nitrogen per area"
unit = "kg{N} m^-2"
function = "get_soil_n_pool_inorganic_per_area"

[[variable]]
name = "soil_respiration_CO2_molar"
description = "Rate of respiration from soil in CO2 molar basis, typically from field measurement using gas chamber"
unit = "mol{CO2} m-2 day-1"
function = "get_soil_respiration_CO2_molar"

[[variable]]
name = "soil_respiration_CO2_mass"
description = "Rate of respiration from soil in CO2 mass basis, typically from field measurement using gas chamber"
unit = "kg{CO2} m-2 day-1"
function = "get_soil_respiration_CO2_mass"

[[variable]]
name = "soil_nitrous_oxide_emission_N2O_mass"
description = "Rate of nitrous oxide emission from soil in N2O mass basis, typically from field measurement using gas chamber"
unit = "kg{N2O} m-2 day-1"
function = "get_soil_nitrous_oxide_emission_N2O_mass"

[[variable]]
name = "stem_c_productivity"
description = "Interval realised stem carbon productivity for each cell"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

[[variable]]
name = "stem_c_productivity_mean"
description = "Mean stem carbon productivity pooled across all cells and timesteps in the selected period. NA outside that period"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

[[variable]]
name = "foliage_c_productivity"
description = "Interval realised foliage carbon productivity for each cell"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

[[variable]]
name = "foliage_c_productivity_mean"
description = "Mean foliage carbon productivity pooled across all cells and timesteps in the selected period. NA outside that period"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

[[variable]]
name = "root_c_productivity"
description = "Interval realised root carbon productivity for each cell"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

[[variable]]
name = "root_c_productivity_mean"
description = "Mean root carbon productivity pooled across all cells and timesteps in the selected period. NA outside that period"
unit = "Mg C ha-1 year-1"
function = "calculate_ve_realised_tissue_productivity"

